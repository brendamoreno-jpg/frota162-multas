// ─── buildDrawerTimeline — gera timeline por statusVariant ───────────────────
function buildDrawerTimeline(row) {
  if (!row) return [];
  const s   = row.statusVariant || '';
  const ait = row.ait || '—';
  const cod = row.codigoInfracao || '';
  const nom = (row.nomeInfracao || '').toUpperCase();

  function addD(str, n) {
    if (!str) return str;
    const [dd, mm, yy] = str.split('/').map(Number);
    const dt = new Date(yy, mm - 1, dd + n);
    return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;
  }

  const d0  = row.dataInfracao || '01/01/2025';
  const d15 = addD(d0, 15);
  const d30 = addD(d0, 30);
  const d32 = addD(d0, 32);
  const d35 = addD(d0, 35);
  const d40 = addD(d0, 40);
  const d45 = addD(d0, 45);
  const d50 = addD(d0, 50);

  const bMulData    = { kind: 'date', date: d0 };
  const bMulCard    = { kind: 'card', iconBg: 'blue', iconType: 'file',
                         title: `Multa recebida (AIT ${ait})`,
                         description: `${ait} | ${cod} — ${nom}` };
  const bBarcode    = { kind: 'alert', icon: 'barcode',
                         title: 'Solicite o boleto de 40% de desconto',
                         subtitle: 'Ao emitir o boleto com desconto de 40% do SNE, não será mais possível indicar condutor para esta multa.' };
  const bIndicar    = { kind: 'card', iconBg: 'blue', iconType: 'user',
                         title: 'Indicar condutor',
                         description: 'Indique o condutor agora pela plataforma via CPF ou Formulário de Indicação.' };
  const bAguarData  = { kind: 'date', date: d15 };
  const bAguarCard  = { kind: 'card', iconBg: 'blue', iconType: 'clock',
                         title: 'Aguardando aceite do condutor',
                         description: 'Peça para o condutor acessar a Carteira Digital de Trânsito e aceitar a indicação.' };
  const bAceiteData = { kind: 'date', date: d30 };
  const bAceiteCard = { kind: 'card', iconBg: 'blue', iconType: 'user',
                         title: 'Condutor aceitou a indicação',
                         description: 'Condutor aceitou a indicação pela Carteira Digital de Trânsito.' };
  const bConclData  = { kind: 'date', date: d32 };
  const bConclCard  = { kind: 'success',
                         title: 'Indicação de condutor foi concluída com sucesso',
                         description: 'A notificação agora passa a ser de penalidade e a responsabilidade foi transferida para o condutor indicado.' };
  const bDispData   = { kind: 'date', date: d40 };
  const bDispCard   = { kind: 'card', iconBg: 'orange', iconType: 'dollar',
                         title: 'Sua multa está disponível para pagamento',
                         description: 'Pague sua multa agora pela plataforma ou emita o boleto para pagamento externo.' };

  // bloco base indicação (do mais antigo para o mais recente, array na ordem top→bottom = recente→antigo)
  const blocoBase = [bMulData, bBarcode, bIndicar, bMulCard];
  const blocoComAguardo = [bAguarData, bAguarCard, ...blocoBase];
  const blocoComAceite  = [bAceiteData, bAceiteCard, ...blocoComAguardo];
  const blocoComConclui = [bConclData, bConclCard, ...blocoComAceite];

  if (s === 'aguardando_aceite') {
    return [
      bAguarData,
      bAguarCard,
      bMulData,
      bBarcode,
      bIndicar,
      bMulCard,
    ];
  }

  if (s === 'em_processamento') {
    return [
      { kind: 'date', date: d45 },
      { kind: 'card', iconBg: 'orange', iconType: 'clock',
        title: 'Pagamento em processamento',
        description: 'Pagamento em andamento. Em breve será confirmado.' },
      ...blocoComConclui,
    ];
  }

  if (s === 'enviada_orgao') {
    return [
      { kind: 'date', date: d35 },
      { kind: 'card', iconBg: 'orange', iconType: 'clock',
        title: 'Formulário enviado ao órgão autuador',
        description: 'A indicação foi submetida ao órgão autuador para análise e deferimento.' },
      ...blocoComConclui,
    ];
  }

  if (s === 'documentos_incorretos') {
    return [
      { kind: 'date', date: d50 },
      { kind: 'card', iconBg: 'orange', iconType: 'clock',
        title: 'Documentos incorretos ou incompletos',
        description: 'Corrija os documentos e reenvie para que o órgão autuador analise a indicação.' },
      { kind: 'date', date: d35 },
      { kind: 'card', iconBg: 'orange', iconType: 'clock',
        title: 'Formulário enviado ao órgão autuador',
        description: 'A indicação foi submetida ao órgão autuador para análise e deferimento.' },
      ...blocoComConclui,
    ];
  }

  if (s === 'indique_no_orgao') {
    return [
      bMulData,
      { kind: 'alert', icon: 'info',
        title: 'Indicação deve ser feita diretamente no órgão',
        subtitle: 'Este AIT requer que a indicação de condutor seja realizada via portal ou presencialmente no órgão autuador.' },
      bMulCard,
    ];
  }

  if (s === 'falha_indicacao') {
    return [
      { kind: 'date', date: d30 },
      { kind: 'card', iconBg: 'orange', iconType: 'clock',
        title: 'Falha na indicação de condutor',
        description: 'Ocorreu uma falha no processo de indicação. Verifique os dados e tente novamente.' },
      ...blocoComAguardo,
    ];
  }

  if (s === 'indicacao_vencida') {
    return [
      { kind: 'date', date: d35 },
      { kind: 'alert', icon: 'info',
        title: 'Vencimento da indicação na plataforma',
        subtitle: 'O prazo para indicação de condutor expirou. Não é mais possível indicar condutor para esta multa.' },
      bMulData,
      bBarcode,
      bIndicar,
      bMulCard,
    ];
  }

  if (s === 'recusado_condutor') {
    return [
      { kind: 'date', date: d32 },
      { kind: 'card', iconBg: 'orange', iconType: 'clock',
        title: 'Condutor recusou a indicação',
        description: 'O condutor indicado recusou a indicação pela Carteira Digital de Trânsito.' },
      ...blocoComAguardo,
    ];
  }

  // Penalidades — mostram o histórico completo de indicação + pagamento
  if (s === 'em_aberto') {
    return [
      bDispData,
      bDispCard,
      ...blocoComConclui,
    ];
  }

  if (s === 'aguardando_aprovacao') {
    return [
      { kind: 'date', date: d45 },
      { kind: 'card', iconBg: 'orange', iconType: 'clock',
        title: 'Pagamento aguardando aprovação',
        description: 'O pagamento está aguardando aprovação do responsável pelos pagamentos da sua empresa.' },
      bDispData,
      bDispCard,
      ...blocoComConclui,
    ];
  }

  if (s === 'processando') {
    return [
      { kind: 'date', date: d50 },
      { kind: 'card', iconBg: 'orange', iconType: 'clock',
        title: 'Pagamento em processamento',
        description: 'Pagamento em andamento. Em breve será confirmado.' },
      { kind: 'date', date: d45 },
      { kind: 'card', iconBg: 'orange', iconType: 'clock',
        title: 'Pagamento aguardando aprovação',
        description: 'O pagamento estava aguardando aprovação do responsável.' },
      bDispData,
      bDispCard,
      ...blocoComConclui,
    ];
  }

  if (s === 'pago') {
    return [
      { kind: 'date', date: d50 },
      { kind: 'success',
        title: 'Multa paga com sucesso!',
        description: 'O pagamento da multa foi identificado com sucesso.' },
      { kind: 'card', iconBg: 'orange', iconType: 'clock',
        title: 'Pagamento em processamento',
        description: 'Pagamento em andamento. Em breve será confirmado.' },
      { kind: 'date', date: d45 },
      { kind: 'card', iconBg: 'orange', iconType: 'clock',
        title: 'Pagamento aguardando aprovação',
        description: 'O pagamento estava aguardando aprovação do responsável.' },
      bDispData,
      bDispCard,
      ...blocoComConclui,
    ];
  }

  if (s === 'recusado') {
    return [
      { kind: 'date', date: d45 },
      { kind: 'card', iconBg: 'orange', iconType: 'clock',
        title: 'Pagamento recusado',
        description: 'O pagamento foi recusado. Entre em contato com o suporte.' },
      bDispData,
      bDispCard,
      ...blocoComConclui,
    ];
  }

  // fallback
  return [bMulData, bBarcode, bIndicar, bMulCard];
}

// ─── DrawerIndicacao ──────────────────────────────────────────────────────────
function DrawerIndicacao({ row, open, onClose, onNavigateToDetail }) {
  useInfEffect(() => {
    if (!open) return;
    const handler = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, [open]);

  // Ícones inline reutilizados no timeline
  const DwIcoUserBlue = () => (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-information-600)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
    </svg>
  );
  const DwIcoClockBlue = () => (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-information-600)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
    </svg>
  );
  const DwIcoClockOrange = () => (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary-600)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
    </svg>
  );
  const DwIcoDollar = () => (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary-600)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
    </svg>
  );
  const DwIcoFileBlue = () => (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-information-600)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
    </svg>
  );
  const DwIcoCheckFilled = () => (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--color-success-600)">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5l-4-4 1.41-1.41L10 13.67l6.59-6.59L18 8.5l-8 8z"/>
    </svg>
  );
  const DwIcoInfoFilled = () => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--color-neutral-400)">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
    </svg>
  );
  const DwIcoBarcode = () => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-neutral-400)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M3 5v14"/><path d="M7 5v14"/><path d="M11 5v14"/><path d="M15 5v14"/><path d="M19 5v14"/>
    </svg>
  );

  function getCardIcon(item) {
    if (item.iconBg === 'orange') {
      if (item.iconType === 'dollar') return <DwIcoDollar />;
      return <DwIcoClockOrange />;
    }
    if (item.iconType === 'file') return <DwIcoFileBlue />;
    if (item.iconType === 'clock') return <DwIcoClockBlue />;
    return <DwIcoUserBlue />;
  }

  // Linha + ponto do connector
  function DwTLRow({ dotKind, isFirst, isLast, children }) {
    const dotSize  = dotKind === 'date' ? 10 : 6;
    const dotColor = dotKind === 'date' ? 'var(--color-neutral-900)' : dotKind === 'success' ? 'var(--color-success-500)' : 'var(--color-neutral-400)';
    const showDot  = dotKind !== 'none';
    return (
      <div style={{ display: 'flex', gap: 16, alignItems: 'stretch' }}>
        <div style={{ width: 10, flexShrink: 0, display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
          <div style={{ flex: 1, width: 1, background: isFirst ? 'transparent' : 'var(--color-neutral-300)', minHeight: showDot ? 6 : 0 }} />
          {showDot && <div style={{ width: dotSize, height: dotSize, borderRadius: '50%', background: dotColor, flexShrink: 0, margin: dotKind === 'date' ? 0 : '2px 0' }} />}
          <div style={{ flex: 1, width: 1, background: isLast ? 'transparent' : 'var(--color-neutral-300)', minHeight: showDot ? 6 : 0 }} />
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>{children}</div>
      </div>
    );
  }

  function DwSpacer() {
    return (
      <div style={{ display: 'flex', gap: 16, height: 16 }}>
        <div style={{ width: 10, flexShrink: 0, display: 'flex', justifyContent: 'center' }}>
          <div style={{ width: 1, height: '100%', background: 'var(--color-neutral-300)' }} />
        </div>
        <div style={{ flex: 1 }} />
      </div>
    );
  }

  function renderTimeline(items) {
    const result = [];
    items.forEach((item, idx) => {
      const isFirst = idx === 0;
      const isLast  = idx === items.length - 1;
      const needsSpacer = !isLast && item.kind !== 'date';

      if (item.kind === 'date') {
        result.push(
          <DwTLRow key={`d${idx}`} dotKind="date" isFirst={isFirst} isLast={isLast}>
            <div style={{ display: 'flex', alignItems: 'center', minHeight: 56 }}>
              <span style={{ fontSize: 14, fontWeight: 700, color: 'var(--color-neutral-900)', fontFamily: 'var(--font-family-primary)' }}>{item.date}</span>
            </div>
          </DwTLRow>
        );
        return;
      }

      if (item.kind === 'alert') {
        result.push(
          <DwTLRow key={`a${idx}`} dotKind="none" isFirst={isFirst} isLast={isLast}>
            <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start', background: 'var(--color-neutral-200)', borderRadius: 12, padding: 12 }}>
              <span style={{ flexShrink: 0, display: 'inline-flex', marginTop: 1 }}>
                {item.icon === 'barcode' ? <DwIcoBarcode /> : <DwIcoInfoFilled />}
              </span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <span style={{ fontSize: 14, fontWeight: 700, color: 'var(--color-neutral-600)', fontFamily: 'var(--font-family-primary)', lineHeight: 1.5, display: 'block' }}>{item.title}</span>
                {item.subtitle && <span style={{ fontSize: 14, fontWeight: 400, color: 'var(--color-neutral-600)', fontFamily: 'var(--font-family-primary)', lineHeight: 1.5, display: 'block', marginTop: 2 }}>{item.subtitle}</span>}
              </div>
            </div>
          </DwTLRow>
        );
        if (needsSpacer) result.push(<DwSpacer key={`s${idx}`} />);
        return;
      }

      if (item.kind === 'success') {
        result.push(
          <DwTLRow key={`sc${idx}`} dotKind="success" isFirst={isFirst} isLast={isLast}>
            <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start', background: 'var(--color-success-100)', borderRadius: 8, padding: 16 }}>
              <span style={{ flexShrink: 0, display: 'inline-flex', marginTop: 2 }}><DwIcoCheckFilled /></span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <span style={{ fontSize: 16, fontWeight: 700, color: 'var(--color-neutral-900)', fontFamily: 'var(--font-family-primary)', lineHeight: 1.5, display: 'block' }}>{item.title}</span>
                {item.description && <span style={{ fontSize: 14, fontWeight: 400, color: 'var(--color-neutral-700)', fontFamily: 'var(--font-family-primary)', lineHeight: 1.5, display: 'block', marginTop: 2 }}>{item.description}</span>}
              </div>
            </div>
          </DwTLRow>
        );
        if (needsSpacer) result.push(<DwSpacer key={`s${idx}`} />);
        return;
      }

      if (item.kind === 'card') {
        const iconBgColor = item.iconBg === 'orange' ? 'var(--color-primary-200)' : 'var(--color-information-100)';
        result.push(
          <DwTLRow key={`c${idx}`} dotKind="card" isFirst={isFirst} isLast={isLast}>
            <div style={{ background: 'var(--color-neutral-100)', border: '1px solid var(--color-neutral-300)', borderRadius: 8, padding: 16, display: 'flex', gap: 16, alignItems: 'center' }}>
              <div style={{ width: 40, height: 40, borderRadius: 4, flexShrink: 0, background: iconBgColor, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                {getCardIcon(item)}
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <span style={{ fontSize: 16, fontWeight: 700, color: 'var(--color-neutral-900)', fontFamily: 'var(--font-family-primary)', lineHeight: 1.5, display: 'block' }}>{item.title}</span>
                {item.description && <span style={{ fontSize: 14, fontWeight: 400, color: 'var(--color-neutral-700)', fontFamily: 'var(--font-family-primary)', lineHeight: 1.5, display: 'block', marginTop: 2 }}>{item.description}</span>}
              </div>
            </div>
          </DwTLRow>
        );
        if (needsSpacer) result.push(<DwSpacer key={`s${idx}`} />);
      }
    });
    return result;
  }

  return (
    <>
      {/* Overlay */}
      {open && (
        <div onClick={onClose} style={{
          position: 'fixed', inset: 0, zIndex: 1000,
          background: 'rgba(0,0,0,0.30)',
          animation: 'fadeIn 200ms ease',
        }} />
      )}

      {/* Drawer */}
      <div style={{
        position: 'fixed', top: 0, right: 0, height: '100vh', width: 480,
        background: '#fff',
        borderRadius: '8px 0 0 8px',
        boxShadow: '2px 4px 24px rgba(0,0,0,0.16)',
        zIndex: 1001,
        display: 'flex', flexDirection: 'column',
        transform: open ? 'translateX(0)' : 'translateX(100%)',
        transition: 'transform 260ms cubic-bezier(.16,1,.3,1)',
        fontFamily: 'var(--font-family-primary)',
      }}>

        {/* Header */}
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: 16,
          borderBottom: '1px solid var(--color-neutral-300)',
          flexShrink: 0,
        }}>
          <span style={{ fontSize: 16, fontWeight: 700, color: 'var(--color-neutral-900)' }}>
            Indicação de condutor
          </span>
          <button onClick={onClose} style={{
            width: 24, height: 24, border: 'none', background: 'transparent',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            cursor: 'pointer', color: 'var(--color-neutral-700)', borderRadius: 4,
            transition: 'background .12s',
          }}
            onMouseEnter={e => e.currentTarget.style.background = 'var(--color-neutral-200)'}
            onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        {/* Body scrollável */}
        <div style={{ flex: 1, overflowY: 'auto', padding: 24 }}>
          {(() => {
            // Usa sempre buildDrawerTimeline — o mock usa formato legado incompatível
            const items = row ? buildDrawerTimeline(row) : [];
            if (!items.length) {
              return (
                <div style={{ color: 'var(--color-neutral-500)', fontSize: 14, textAlign: 'center', paddingTop: 40 }}>
                  Nenhum histórico disponível.
                </div>
              );
            }
            return <div style={{ display: 'flex', flexDirection: 'column' }}>{renderTimeline(items)}</div>;
          })()}
        </div>

        {/* Footer */}
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'flex-end', gap: 16,
          padding: 16,
          borderTop: '1px solid var(--color-neutral-300)',
          flexShrink: 0,
          background: '#fff',
        }}>
          <button onClick={onClose} style={{
            padding: '8px 16px', border: 'none', background: 'transparent',
            fontSize: 14, fontWeight: 700, color: 'var(--color-neutral-900)',
            cursor: 'pointer', fontFamily: 'var(--font-family-primary)', borderRadius: 8,
            transition: 'background .12s',
          }}
            onMouseEnter={e => e.currentTarget.style.background = 'var(--color-neutral-200)'}
            onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
          >
            Fechar
          </button>
          <button onClick={() => { onClose(); onNavigateToDetail && onNavigateToDetail(row?.ait); }} style={{
            padding: '8px 16px', border: 'none', borderRadius: 8,
            background: 'var(--color-primary-500)',
            fontSize: 14, fontWeight: 700, color: '#fff',
            cursor: 'pointer', fontFamily: 'var(--font-family-primary)',
            transition: 'opacity .12s',
          }}
            onMouseEnter={e => e.currentTarget.style.opacity = '0.85'}
            onMouseLeave={e => e.currentTarget.style.opacity = '1'}
          >
            Ver mais detalhes
          </button>
        </div>
      </div>

      <style>{`@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }`}</style>
    </>
  );
}

// ─── ModalPagamento ───────────────────────────────────────────────────────────
function ModalPagamento({ row, onClose }) {
  if (!row) return null;

  // Fecha com Esc
  useInfEffect(() => {
    const handler = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, []);

  const mock = typeof getMock === 'function' ? getMock(row.ait) : null;
  // row é a fonte primária — mock só preenche se o row não tiver o campo
  const valor  = row.valor  || mock?.valor  || '—';
  const placa  = row.placa  || mock?.placa  || '—';
  const ait    = row.ait      || '—';
  const tipo   = 'Multa';

  // Estilos internos da tabela (sem Tailwind)
  const thStyle = {
    background: 'var(--color-neutral-200)',
    height: 30,
    padding: '0 8px',
    display: 'flex', alignItems: 'center',
    fontSize: 12, fontWeight: 700, textTransform: 'uppercase',
    color: '#3a3940', whiteSpace: 'nowrap',
    fontFamily: 'var(--font-family-primary)',
  };
  const tdStyle = {
    background: 'var(--color-neutral-200)',
    height: 37,
    padding: '0 8px',
    display: 'flex', alignItems: 'center',
    fontSize: 14, fontWeight: 400,
    color: '#2f2e33', whiteSpace: 'nowrap',
    fontFamily: 'var(--font-family-primary)',
  };
  const tdTotalStyle = {
    ...tdStyle,
    background: 'var(--color-neutral-300)',
    fontWeight: 700,
  };

  const cols = [
    { label: 'Tipo',  value: tipo,  totalValue: 'Total', align: 'left'  },
    { label: 'Placa', value: placa, totalValue: '',       align: 'left'  },
    { label: 'AIT',   value: ait,   totalValue: '',       align: 'left'  },
    { label: 'Multa', value: valor, totalValue: '',       align: 'left'  },
    { label: 'Valor', value: valor, totalValue: '',       align: 'left'  },
    { label: 'Total', value: valor, totalValue: valor,    align: 'right' },
  ];

  return ReactDOM.createPortal(
    <div
      onClick={onClose}
      style={{
        position: 'fixed', inset: 0, zIndex: 10000,
        background: 'rgba(0,0,0,0.45)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        animation: 'fadeInOverlay .18s ease',
      }}>
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          background: '#fff',
          borderRadius: 8,
          width: 640, maxWidth: 'calc(100vw - 32px)',
          boxShadow: '2px 2px 4px rgba(0,0,0,0.08)',
          fontFamily: 'var(--font-family-primary)',
          animation: 'slideUpModal .2s cubic-bezier(.16,1,.3,1)',
          display: 'flex', flexDirection: 'column', gap: 16,
          padding: 16,
        }}>

        {/* ── Header ── */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <span style={{ fontSize: 16, fontWeight: 700, color: 'var(--color-neutral-900)', fontFamily: 'var(--font-family-primary)' }}>
            Revise as informações antes de concluir
          </span>
          <button
            onClick={onClose}
            style={{

            onClick={onClose}

      </div>
    </div>,
    document.body
  );
}

// ─── buildPaymentTimeline — gera timeline de pagamento por statusVariant ──────
function buildPaymentTimeline(row) {
  if (!row) return [];
  const s = row.statusVariant || '';

  function addD(str, n) {
    if (!str) return str;
    const [dd, mm, yy] = str.split('/').map(Number);
    const dt = new Date(yy, mm - 1, dd + n);
    return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;
  }

  // Usa a data de vencimento como âncora; fallback para dataInfracao + 90d
  const anchor = row.vencimento || addD(row.dataInfracao || '01/01/2025', 90);
  const dm7 = addD(anchor, -7);
  const dm3 = addD(anchor, -3);
  const d0  = anchor;

  const bDispDate = { kind: 'date', date: dm7 };
  const bDispCard = { kind: 'card', iconBg: 'orange', iconType: 'dollar',
    title: 'Sua multa está disponível para pagamento',
    description: 'Pague sua multa agora pela plataforma ou emita o boleto para pagamento externo.' };
  const bAgDate   = { kind: 'date', date: dm3 };
  const bAgCard   = { kind: 'card', iconBg: 'orange', iconType: 'clock',
    title: 'Pagamento aguardando aprovação',
    description: 'O pagamento está aguardando aprovação do responsável pelos pagamentos da sua empresa.' };
  const bProcDate = { kind: 'date', date: d0 };
  const bProcCard = { kind: 'card', iconBg: 'orange', iconType: 'clock',
    title: 'Pagamento em processamento',
    description: 'Pagamento em andamento. Em breve será confirmado.' };

  if (s === 'aguardando_aprovacao') {
    return [bAgDate, bAgCard, bDispDate, bDispCard];
  }
  if (s === 'processando') {
    return [bProcDate, bProcCard, bAgDate, bAgCard, bDispDate, bDispCard];
  }
  if (s === 'pago') {
    return [
      { kind: 'date', date: d0 },
      { kind: 'success', title: 'Multa paga com sucesso!',
        description: 'O pagamento da multa foi identificado com sucesso.' },
      bProcCard,
      bAgDate, bAgCard,
      bDispDate, bDispCard,
    ];
  }
  if (s === 'recusado') {
    return [
      { kind: 'date', date: d0 },
      { kind: 'card', iconBg: 'orange', iconType: 'clock',
        title: 'Pagamento recusado',
        description: 'O pagamento foi recusado. Entre em contato com o suporte.' },
      bAgDate, bAgCard, bDispDate, bDispCard,
    ];
  }
  if (s === 'vencido') {
    return [
      { kind: 'date', date: d0 },
      { kind: 'alert', icon: 'info',
        title: 'Pagamento vencido',
        subtitle: 'O prazo para pagamento desta multa expirou.' },
      bDispDate, bDispCard,
    ];
  }
  if (s === 'cancelado') {
    return [
      { kind: 'date', date: d0 },
      { kind: 'alert', icon: 'info',
        title: 'Pagamento cancelado',
        subtitle: 'O pagamento desta multa foi cancelado.' },
      bDispDate, bDispCard,
    ];
  }
  return [bDispDate, bDispCard];
}

// ─── DrawerPagamento ──────────────────────────────────────────────────────────
function DrawerPagamento({ row, open, onClose, onNavigateToDetail }) {
  useInfEffect(() => {
    if (!open) return;
    const handler = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, [open]);

  // ── Ícones inline ──────────────────────────────────────────────────────────
  const PwIcoClockOrange = () => (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary-600)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
    </svg>
  );
  const PwIcoDollar = () => (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary-600)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
    </svg>
  );
  const PwIcoCheckFilled = () => (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--color-success-600)">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5l-4-4 1.41-1.41L10 13.67l6.59-6.59L18 8.5l-8 8z"/>
    </svg>
  );
  const PwIcoInfoFilled = () => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--color-neutral-400)">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
    </svg>
  );

  function getCardIcon(item) {
    if (item.iconType === 'dollar') return <PwIcoDollar />;
    return <PwIcoClockOrange />;
  }

  function PwTLRow({ dotKind, isFirst, isLast, children }) {
    const dotSize  = dotKind === 'date' ? 10 : 6;
    const dotColor = dotKind === 'date' ? 'var(--color-neutral-900)' : dotKind === 'success' ? 'var(--color-success-500)' : 'var(--color-neutral-400)';
    const showDot  = dotKind !== 'none';
    return (
      <div style={{ display: 'flex', gap: 16, alignItems: 'stretch' }}>
        <div style={{ width: 10, flexShrink: 0, display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
          <div style={{ flex: 1, width: 1, background: isFirst ? 'transparent' : 'var(--color-neutral-300)', minHeight: showDot ? 6 : 0 }} />
          {showDot && <div style={{ width: dotSize, height: dotSize, borderRadius: '50%', background: dotColor, flexShrink: 0, margin: dotKind === 'date' ? 0 : '2px 0' }} />}
          <div style={{ flex: 1, width: 1, background: isLast ? 'transparent' : 'var(--color-neutral-300)', minHeight: showDot ? 6 : 0 }} />
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>{children}</div>
      </div>
    );
  }

  function PwSpacer() {
    return (
      <div style={{ display: 'flex', gap: 16, height: 16 }}>
        <div style={{ width: 10, flexShrink: 0, display: 'flex', justifyContent: 'center' }}>
          <div style={{ width: 1, height: '100%', background: 'var(--color-neutral-300)' }} />
        </div>
        <div style={{ flex: 1 }} />
      </div>
    );
  }

  function renderTimeline(items) {
    const result = [];
    items.forEach((item, idx) => {
      const isFirst = idx === 0;
      const isLast  = idx === items.length - 1;
      const needsSpacer = !isLast && item.kind !== 'date';

      if (item.kind === 'date') {
        result.push(
          <PwTLRow key={`d${idx}`} dotKind="date" isFirst={isFirst} isLast={isLast}>
            <div style={{ display: 'flex', alignItems: 'center', minHeight: 56 }}>
              <span style={{ fontSize: 14, fontWeight: 700, color: 'var(--color-neutral-900)', fontFamily: 'var(--font-family-primary)' }}>{item.date}</span>
            </div>
          </PwTLRow>
        );
        return;
      }

      if (item.kind === 'alert') {
        result.push(
          <PwTLRow key={`a${idx}`} dotKind="none" isFirst={isFirst} isLast={isLast}>
            <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start', background: 'var(--color-neutral-200)', borderRadius: 12, padding: 12 }}>
              <span style={{ flexShrink: 0, display: 'inline-flex', marginTop: 1 }}><PwIcoInfoFilled /></span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <span style={{ fontSize: 14, fontWeight: 700, color: 'var(--color-neutral-600)', fontFamily: 'var(--font-family-primary)', lineHeight: 1.5, display: 'block' }}>{item.title}</span>
                {item.subtitle && <span style={{ fontSize: 14, fontWeight: 400, color: 'var(--color-neutral-600)', fontFamily: 'var(--font-family-primary)', lineHeight: 1.5, display: 'block', marginTop: 2 }}>{item.subtitle}</span>}
              </div>
            </div>
          </PwTLRow>
        );
        if (needsSpacer) result.push(<PwSpacer key={`s${idx}`} />);
        return;
      }

      if (item.kind === 'success') {
        result.push(
          <PwTLRow key={`sc${idx}`} dotKind="success" isFirst={isFirst} isLast={isLast}>
            <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start', background: 'var(--color-success-100)', border: '1px solid var(--color-neutral-300)', borderRadius: 8, padding: 16 }}>
              <span style={{ flexShrink: 0, display: 'inline-flex', marginTop: 2 }}><PwIcoCheckFilled /></span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <span style={{ fontSize: 16, fontWeight: 700, color: 'var(--color-neutral-900)', fontFamily: 'var(--font-family-primary)', lineHeight: 1.5, display: 'block' }}>{item.title}</span>
                {item.description && <span style={{ fontSize: 14, fontWeight: 400, color: 'var(--color-neutral-700)', fontFamily: 'var(--font-family-primary)', lineHeight: 1.5, display: 'block', marginTop: 2 }}>{item.description}</span>}
              </div>
            </div>
          </PwTLRow>
        );
        if (needsSpacer) result.push(<PwSpacer key={`s${idx}`} />);
        return;
      }

      if (item.kind === 'card') {
        const iconBgColor = 'var(--color-primary-200)';
        result.push(
          <PwTLRow key={`c${idx}`} dotKind="card" isFirst={isFirst} isLast={isLast}>
            <div style={{ background: 'var(--color-neutral-100)', border: '1px solid var(--color-neutral-300)', borderRadius: 8, padding: 16, display: 'flex', gap: 16, alignItems: 'center' }}>
              <div style={{ width: 40, height: 40, borderRadius: 8, flexShrink: 0, background: iconBgColor, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                {getCardIcon(item)}
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <span style={{ fontSize: 16, fontWeight: 700, color: 'var(--color-neutral-900)', fontFamily: 'var(--font-family-primary)', lineHeight: 1.5, display: 'block' }}>{item.title}</span>
                {item.description && <span style={{ fontSize: 14, fontWeight: 400, color: 'var(--color-neutral-700)', fontFamily: 'var(--font-family-primary)', lineHeight: 1.5, display: 'block', marginTop: 2 }}>{item.description}</span>}
              </div>
            </div>
          </PwTLRow>
        );
        if (needsSpacer) result.push(<PwSpacer key={`s${idx}`} />);
      }
    });
    return result;
  }


  const items = row ? buildPaymentTimeline(row) : [];

  return (
    <>
      {/* Overlay */}
      {open && (
        <div onClick={onClose} style={{
          position: 'fixed', inset: 0, zIndex: 1000,
          background: 'rgba(0,0,0,0.30)',
          animation: 'fadeIn 200ms ease',
        }} />
      )}

      {/* Drawer */}
      <div style={{
        position: 'fixed', top: 0, right: 0, height: '100vh', width: 480,
        background: '#fff',
        borderRadius: '8px 0 0 8px',
        boxShadow: '2px 4px 24px rgba(0,0,0,0.16)',
        zIndex: 1001,
        display: 'flex', flexDirection: 'column',
        transform: open ? 'translateX(0)' : 'translateX(100%)',
        transition: 'transform 260ms cubic-bezier(.16,1,.3,1)',
        fontFamily: 'var(--font-family-primary)',
      }}>

        {/* Header */}
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: 16,
          borderBottom: '1px solid var(--color-neutral-300)',
          flexShrink: 0,
        }}>
          <span style={{ fontSize: 16, fontWeight: 700, color: 'var(--color-neutral-900)' }}>
            Pagamento
          </span>
          <button onClick={onClose} style={{
            width: 24, height: 24, border: 'none', background: 'transparent',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            cursor: 'pointer', color: 'var(--color-neutral-700)', borderRadius: 4,
            transition: 'background .12s',
          }}
            onMouseEnter={e => e.currentTarget.style.background = 'var(--color-neutral-200)'}
            onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        {/* Body scrollável */}
        <div style={{ flex: 1, overflowY: 'auto', padding: 24 }}>
          {items.length === 0 ? (
            <div style={{ color: 'var(--color-neutral-500)', fontSize: 14, textAlign: 'center', paddingTop: 40 }}>
              Nenhum histórico disponível.
            </div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column' }}>{renderTimeline(items)}</div>
          )}
        </div>

        {/* Footer */}
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'flex-end', gap: 16,
          padding: 16,
          borderTop: '1px solid var(--color-neutral-300)',
          flexShrink: 0,
          background: '#fff',
        }}>
          <button onClick={onClose} style={{
            padding: '8px 16px', border: 'none', background: 'transparent',
            fontSize: 14, fontWeight: 700, color: 'var(--color-neutral-900)',
            cursor: 'pointer', fontFamily: 'var(--font-family-primary)', borderRadius: 8,
            transition: 'background .12s',
          }}
            onMouseEnter={e => e.currentTarget.style.background = 'var(--color-neutral-200)'}
            onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
          >
            Fechar
          </button>
          <button onClick={() => { onClose(); onNavigateToDetail && onNavigateToDetail(row?.ait); }} style={{
            padding: '8px 16px', border: 'none', borderRadius: 8,
            background: 'var(--color-primary-500)',
            fontSize: 14, fontWeight: 700, color: '#fff',
            cursor: 'pointer', fontFamily: 'var(--font-family-primary)',
            transition: 'opacity .12s',
          }}
            onMouseEnter={e => e.currentTarget.style.opacity = '0.85'}
            onMouseLeave={e => e.currentTarget.style.opacity = '1'}
          >
            Ver mais detalhes
          </button>
        </div>
      </div>
    </>
  );
}

// ─── MultiAutocompleteSelect ─────────────────────────────────────────────────
// Multi-select conforme Design System Frota 162 (node 3730-6070)
// ─── QuickSelect — dropdown simples com label, visual igual ao AutocompleteSelect ─
function QuickSelect({ label, value, options, onChange, flex, minWidth }) {
  const [open, setOpen] = useInfState(false);
  const wrapRef = useInfRef(null);
  const [dropRect, setDropRect] = useInfState(null);

  useInfEffect(() => {
    if (!open) return;
    const handler = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open]);

  function openDrop() {
    if (!wrapRef.current) return;
    setDropRect(wrapRef.current.getBoundingClientRect());
    setOpen(true);
  }

  return (
    <div style={{ flex: flex || '1 1 0', minWidth: minWidth || 0, display: 'flex', flexDirection: 'column', gap: 4 }}>
      <label style={{ fontSize: 12, fontWeight: 600, color: 'var(--color-neutral-700)', fontFamily: 'var(--font-family-primary)', display: 'block', pointerEvents: 'none' }}>{label}</label>
      <div
        ref={wrapRef}
        onClick={open ? () => setOpen(false) : openDrop}
        style={{
          position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 6,
          height: 38, padding: '0 12px',
          border: '1px solid ' + (open ? 'var(--color-primary-500)' : 'var(--color-neutral-400)'),
          borderRadius: 8, background: '#fff',
          fontFamily: 'var(--font-family-primary)', fontSize: 13,
          color: value ? 'var(--color-neutral-1000)' : 'var(--color-neutral-700)',
          cursor: 'pointer', userSelect: 'none',
        }}>
        <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
          {value || 'Selecione'}
        </span>
        {value
          ? <span onMouseDown={(e) => { e.stopPropagation(); onChange(''); }} style={{ display: 'flex', color: 'var(--color-neutral-500)', cursor: 'pointer' }}><IconX /></span>
          : <span style={{ display: 'flex', color: 'var(--color-neutral-600)', transition: 'transform .2s', transform: open ? 'rotate(180deg)' : '' }}><IconChevronDown /></span>
        }
      </div>
      {open && dropRect && ReactDOM.createPortal(
        <div style={{
          position: 'fixed', top: dropRect.bottom + 4, left: dropRect.left, width: dropRect.width,
          zIndex: 9999, background: '#fff', border: '1px solid var(--color-neutral-300)',
          borderRadius: 8, boxShadow: '0 4px 16px rgba(0,0,0,0.12)', overflow: 'auto', maxHeight: 220,
        }}>
          {options.map((opt) => (
            <div key={opt}
              onMouseDown={() => { onChange(opt === value ? '' : opt); setOpen(false); }}
              style={{
                padding: '8px 12px', fontSize: 13, cursor: 'pointer',
                fontFamily: 'var(--font-family-primary)',
                color: opt === value ? 'var(--color-primary-600)' : 'var(--color-neutral-900)',
                background: opt === value ? 'var(--color-primary-50, #eff6ff)' : 'transparent',
              }}
              onMouseEnter={(e) => { if (opt !== value) e.currentTarget.style.background = 'var(--color-neutral-100)'; }}
              onMouseLeave={(e) => { e.currentTarget.style.background = opt === value ? 'var(--color-primary-50, #eff6ff)' : 'transparent'; }}
            >{opt}</div>
          ))}
        </div>,
        document.body
      )}
    </div>
  );
}

// Campo fixo 40px • chips border-style • dropdown com checkbox DS • "Selecionar todos"
// Overflow "+N" calculado dinamicamente pela largura real do campo

function MultiAutocompleteSelect({ label, placeholder, options, value, onChange, flex, minWidth }) {
  const [selectedItems, setSelectedItems] = useInfState(value || []);
  const [filterQuery, setFilterQuery] = useInfState('');
  const [open, setOpen] = useInfState(false);
  const [focused, setFocused] = useInfState(false);
  const [dropRect, setDropRect] = useInfState(null);
  const [overflowIdx, setOverflowIdx] = useInfState(null); // null = sem overflow, N = mostrar chips 0..N-1
  const wrapRef = useInfRef(null);
  const fieldRef = useInfRef(null);
  const inputRef = useInfRef(null);
  const measureRef = useInfRef(null); // div oculta para medir chips

  const allSelected = options.length > 0 && selectedItems.length === options.length;
  const someSelected = selectedItems.length > 0 && !allSelected;
  const hasSelection = selectedItems.length > 0;
  const isActive = focused || open;

  const filtered = filterQuery
    ? options.filter(o => o.toLowerCase().includes(filterQuery.toLowerCase()))
    : options;

  // Calcula quantos chips cabem na largura real do campo
  useInfEffect(() => {
    if (!measureRef.current || !fieldRef.current || selectedItems.length === 0) {
      setOverflowIdx(null);
      return;
    }
    const chipEls = measureRef.current.querySelectorAll('[data-chip-measure]');
    if (!chipEls.length) { setOverflowIdx(null); return; }

    // Largura disponível = largura do campo - padding esquerdo(16) - padding direito(12) - chevron(16) - gap(8)
    const available = fieldRef.current.clientWidth - 16 - 12 - 16 - 8;
    const OVERFLOW_W = 56; // largura estimada do "+N ×"
    const GAP = 4;

    let acc = 0;
    let idx = null;
    for (let i = 0; i < chipEls.length; i++) {
      const w = chipEls[i].offsetWidth + (i > 0 ? GAP : 0);
      const hasMore = i < chipEls.length - 1;
      const needed = acc + w + (hasMore ? GAP + OVERFLOW_W : 0);
      if (needed > available) { idx = i; break; }
      acc += w;
    }
    setOverflowIdx(idx);
  }, [selectedItems]);

  const visibleChips = overflowIdx !== null ? selectedItems.slice(0, overflowIdx) : selectedItems;
  const overflowCount = overflowIdx !== null ? selectedItems.length - overflowIdx : 0;

  const calcRect = () => {
    if (fieldRef.current) {
      const r = fieldRef.current.getBoundingClientRect();
      setDropRect({ top: r.bottom + 4, left: r.left, width: r.width });
    }
  };

  const openDropdown = () => { calcRect(); setOpen(true); };

  const handleFieldClick = () => {
    inputRef.current && inputRef.current.focus();
    openDropdown();
  };

  const handleFocus = () => { setFocused(true); openDropdown(); };

  const handleInputChange = (e) => {
    setFilterQuery(e.target.value);
    if (!open) openDropdown();
  };

  const handleToggle = (opt) => {
    const next = selectedItems.includes(opt)
      ? selectedItems.filter(i => i !== opt)
      : [...selectedItems, opt];
    setSelectedItems(next);
    onChange && onChange(next);
    setFilterQuery('');
    setTimeout(() => inputRef.current && inputRef.current.focus(), 0);
  };

  const handleToggleAll = () => {
    const next = allSelected ? [] : [...options];
    setSelectedItems(next);
    onChange && onChange(next);
  };

  const handleRemoveChip = (e, opt) => {
    e.stopPropagation();
    const next = selectedItems.filter(i => i !== opt);
    setSelectedItems(next);
    onChange && onChange(next);
  };

  const handleRemoveOverflow = (e) => {
    e.stopPropagation();
    const next = selectedItems.slice(0, MULTI_MAX_CHIPS);
    setSelectedItems(next);
    onChange && onChange(next);
  };

  useInfEffect(() => {
    if (open) calcRect();
  }, [open]);

  useInfEffect(() => {
    const handler = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) {
        setOpen(false); setFocused(false); setFilterQuery('');
      }
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  // ── Chip DS style ──
  const chipStyle = {
    display: 'inline-flex', alignItems: 'center', gap: 4,
    border: '1px solid var(--color-neutral-400, #ddddde)',
    borderRadius: 8, padding: '3px 8px',
    background: 'var(--color-neutral-100, #fff)',
    fontSize: 12, lineHeight: '15px', fontWeight: 400,
    fontFamily: 'var(--font-family-primary)',
    color: 'var(--color-neutral-1000, #0a0a0a)',
    whiteSpace: 'nowrap', flexShrink: 0,
  };

  return (
    <div ref={wrapRef} style={{ display: 'flex', flexDirection: 'column', gap: 4, minWidth: minWidth || 180, flex: flex || '1 1 180px', position: 'relative' }}>
      <label style={filterLabelStyle}>{label}</label>

      {/* Div de medição oculta — renderiza todos os chips para medir largura real */}
      <div ref={measureRef} style={{
        position: 'absolute', visibility: 'hidden', pointerEvents: 'none',
        display: 'flex', gap: 4, top: 0, left: 0, zIndex: -1,
      }}>
        {selectedItems.map(item => (
          <span key={item} data-chip-measure style={chipStyle}>{item}<span style={{ display: 'inline-flex', marginLeft: 4 }}><IconX /></span></span>
        ))}
      </div>

      {/* ── Field ── */}
      <div
        ref={fieldRef}
        onClick={handleFieldClick}
        style={{
          display: 'flex', alignItems: 'center', gap: 8,
          cursor: 'text',
          border: `1px solid ${isActive ? 'var(--color-primary-500)' : 'var(--color-neutral-400, #ddddde)'}`,
          borderRadius: 8, background: 'var(--color-neutral-100)',
          height: 40, padding: '0 12px 0 16px',
          boxShadow: isActive ? '0 0 0 3px var(--color-primary-100)' : 'none',
          transition: 'border-color .15s, box-shadow .15s',
          overflow: 'hidden', position: 'relative',
        }}>
        {/* Chips + input invisível */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 4, flex: 1, minWidth: 0, overflow: 'hidden' }}>
          {visibleChips.map(item => (
            <span key={item} style={chipStyle}>
              {item}
              <span onMouseDown={(e) => handleRemoveChip(e, item)}
                style={{ display: 'inline-flex', alignItems: 'center', cursor: 'pointer', color: 'var(--color-neutral-600)' }}>
                <IconX />
              </span>
            </span>
          ))}
          {overflowCount > 0 && (
            <span style={chipStyle}>
              +{overflowCount}
              <span onMouseDown={handleRemoveOverflow}
                style={{ display: 'inline-flex', alignItems: 'center', cursor: 'pointer', color: 'var(--color-neutral-600)' }}>
                <IconX />
              </span>
            </span>
          )}
          <input
            ref={inputRef}
            className="inf-placeholder-input"
            value={filterQuery}
            placeholder={hasSelection ? '' : placeholder}
            onFocus={handleFocus}
            onBlur={() => setFocused(false)}
            onChange={handleInputChange}
            style={{
              flex: '1 1 60px', border: 'none', outline: 'none', background: 'transparent',
              fontFamily: 'var(--font-family-primary)', fontSize: 14,
              color: 'var(--color-neutral-900)', height: 38, minWidth: 40, padding: 0,
            }}
          />
        </div>
        {/* Chevron — roda quando aberto */}
        <span style={{
          color: 'var(--color-neutral-600)', display: 'inline-flex', flexShrink: 0,
          transform: open ? 'rotate(180deg)' : 'none', transition: 'transform .2s',
        }}>
          <IconChevronDown />
        </span>
      </div>

      {/* ── Dropdown ── */}
      {open && dropRect && (
        <div style={{
          position: 'fixed', top: dropRect.top, left: dropRect.left, width: dropRect.width,
          zIndex: 9999, background: '#fff',
          border: '1px solid var(--color-neutral-400, #ddddde)',
          borderRadius: 8, boxShadow: '0 4px 20px rgba(0,0,0,0.12)',
          maxHeight: 280, overflowY: 'auto', padding: 2,
        }}>
          <div style={{ display: 'flex', flexDirection: 'column', padding: '8px 0' }}>

            {/* Selecionar todos */}
            <div
              onMouseDown={handleToggleAll}
              style={{ display: 'flex', alignItems: 'center', gap: 8, padding: 8, cursor: 'pointer', borderRadius: 6 }}
              onMouseEnter={e => e.currentTarget.style.background = 'var(--color-neutral-100)'}
              onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
            >
              {/* Checkbox DS */}
              <div style={{ width: 24, height: 24, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                <div style={{
                  width: 16, height: 16, borderRadius: 4, flexShrink: 0,
                  border: (allSelected || someSelected) ? 'none' : '1px solid var(--color-neutral-500, #bebec0)',
                  background: (allSelected || someSelected) ? 'var(--color-primary-500, #f9401b)' : 'transparent',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>
                  {allSelected && <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                  {someSelected && <svg width="8" height="2" viewBox="0 0 8 2" fill="none"><path d="M1 1H7" stroke="white" strokeWidth="2" strokeLinecap="round"/></svg>}
                </div>
              </div>
              <span style={{ fontSize: 14, fontWeight: 700, fontFamily: 'var(--font-family-primary)', color: 'var(--color-neutral-1000)' }}>
                Selecionar todos
              </span>
            </div>

            {/* Divisor */}
            <div style={{ height: 1, background: 'var(--color-neutral-200)', margin: '2px 8px' }} />

            {/* Opções */}
            {filtered.map(opt => {
              const isSel = selectedItems.includes(opt);
              return (
                <div
                  key={opt}
                  onMouseDown={() => handleToggle(opt)}
                  style={{ display: 'flex', alignItems: 'center', gap: 8, padding: 8, cursor: 'pointer', borderRadius: 6 }}
                  onMouseEnter={e => e.currentTarget.style.background = 'var(--color-neutral-100)'}
                  onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                >
                  {/* Checkbox DS */}
                  <div style={{ width: 24, height: 24, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                    <div style={{
                      width: 16, height: 16, borderRadius: 4, flexShrink: 0,
                      border: isSel ? 'none' : '1px solid var(--color-neutral-500, #bebec0)',
                      background: isSel ? 'var(--color-primary-500, #f9401b)' : 'transparent',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                    }}>
                      {isSel && <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                    </div>
                  </div>
                  <span style={{
                    fontSize: 14, fontWeight: isSel ? 700 : 400,
                    fontFamily: 'var(--font-family-primary)',
                    color: 'var(--color-neutral-1000)',
                    overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', flex: 1,
                  }}>{opt}</span>
                </div>
              );
            })}

            {filtered.length === 0 && (
              <div style={{ padding: '10px 16px', fontSize: 14, color: 'var(--color-neutral-500)', fontFamily: 'var(--font-family-primary)' }}>
                Nenhum resultado
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── DateRangePicker ──────────────────────────────────────────────────────────
function DateRangePicker({ startDate, endDate, onChange, inputStyle, wrapStyle }) {
  const [open, setOpen] = useInfState(false);
  const [hoverDate, setHoverDate] = useInfState(null);
  const [phase, setPhase] = useInfState('start'); // 'start' | 'end'
  const [viewMonth, setViewMonth] = useInfState(() => {
    const d = startDate || new Date();
    return { year: d.getFullYear(), month: d.getMonth() };
  });
  const [dropPos, setDropPos] = useInfState({});
  const fieldRef = useInfRef(null);
  const dropRef = useInfRef(null);

  const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const DAYS   = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  function fmtDate(d) {
    if (!d) return '';
    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  }
  function isSameDay(a, b) {
    return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }
  const displayText = startDate && endDate
    ? `${fmtDate(startDate)} – ${fmtDate(endDate)}`
    : startDate ? `${fmtDate(startDate)} – ...` : '';

  function openPicker() {
    if (!fieldRef.current) return;
    const r = fieldRef.current.getBoundingClientRect();
    const pickerH = 340;
    const top = (window.innerHeight - r.bottom) >= pickerH ? r.bottom + 4 : r.top - pickerH - 4;
    setDropPos({ top, left: r.left });
    setOpen(true);
    setPhase(startDate ? 'end' : 'start');
  }

  useInfEffect(() => {
    if (!open) return;
    const h = (e) => {
      if (fieldRef.current && !fieldRef.current.contains(e.target) &&
          dropRef.current && !dropRef.current.contains(e.target)) {
        setOpen(false); setHoverDate(null);
      }
    };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [open]);

  function handleDayClick(date) {
    if (phase === 'start') {
      onChange(date, null);
      setPhase('end');
    } else {
      if (date < startDate) { onChange(date, startDate); }
      else { onChange(startDate, date); }
      setPhase('start');
      setOpen(false);
      setHoverDate(null);
    }
  }

  function prevMonth() {
    setViewMonth(v => {
      const d = new Date(v.year, v.month - 1, 1);
      return { year: d.getFullYear(), month: d.getMonth() };
    });
  }
  function nextMonth() {
    setViewMonth(v => {
      const d = new Date(v.year, v.month + 1, 1);
      return { year: d.getFullYear(), month: d.getMonth() };
    });
  }

  const { year, month } = viewMonth;
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));

  const todayStr = new Date().toDateString();

  return (
    <div ref={fieldRef} style={{ position: 'relative', ...wrapStyle }}>
      <div
        onClick={() => open ? setOpen(false) : openPicker()}
        style={{
          display: 'flex', alignItems: 'center',
          height: 40, padding: '0 32px 0 12px', boxSizing: 'border-box',
          border: `1px solid ${open ? 'var(--color-primary-500)' : 'var(--color-neutral-400)'}`,
          borderRadius: 8, background: '#fff', cursor: 'pointer',
          fontFamily: 'var(--font-family-primary)', fontSize: 13,
          color: displayText ? 'var(--color-neutral-1000)' : 'var(--color-neutral-700)',
          whiteSpace: 'nowrap', overflow: 'hidden',
          boxShadow: open ? '0 0 0 2px var(--color-primary-200)' : 'none',
          transition: 'border-color .15s, box-shadow .15s',
          ...inputStyle,
        }}
      >
        <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis' }}>
          {displayText || 'DD/MM/AAAA – DD/MM/AAAA'}
        </span>
        {(startDate || endDate) ? (
          <span
            onMouseDown={e => { e.stopPropagation(); onChange(null, null); setPhase('start'); }}
            style={{ position: 'absolute', right: 10, top: '50%', transform: 'translateY(-50%)', cursor: 'pointer', color: 'var(--color-neutral-500)', display: 'inline-flex' }}
          ><IconX /></span>
        ) : (
          <span style={{ position: 'absolute', right: 10, top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none', display: 'inline-flex', color: 'var(--color-neutral-600)' }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </span>
        )}
      </div>

      {open && ReactDOM.createPortal(
        <div ref={dropRef} style={{
          position: 'fixed', top: dropPos.top, left: dropPos.left,
          width: 280, zIndex: 9999, background: '#fff',
          border: '1px solid var(--color-neutral-200)', borderRadius: 12,
          boxShadow: '0 8px 32px rgba(0,0,0,0.14)',
          fontFamily: 'var(--font-family-primary)',
        }}>
          {/* Header */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 16px 10px' }}>
            <button onClick={prevMonth} style={{
              background: 'none', border: 'none', cursor: 'pointer', padding: '4px 8px',
              borderRadius: 6, color: 'var(--color-neutral-700)', fontSize: 16, lineHeight: 1,
              display: 'flex', alignItems: 'center', transition: 'background .1s',
            }}
            onMouseEnter={e => e.currentTarget.style.background = 'var(--color-neutral-200)'}
            onMouseLeave={e => e.currentTarget.style.background = 'none'}>‹</button>
            <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--color-neutral-900)' }}>
              {MONTHS[month]} {year}
            </span>
            <button onClick={nextMonth} style={{
              background: 'none', border: 'none', cursor: 'pointer', padding: '4px 8px',
              borderRadius: 6, color: 'var(--color-neutral-700)', fontSize: 16, lineHeight: 1,
              display: 'flex', alignItems: 'center', transition: 'background .1s',
            }}
            onMouseEnter={e => e.currentTarget.style.background = 'var(--color-neutral-200)'}
            onMouseLeave={e => e.currentTarget.style.background = 'none'}>›</button>
          </div>
          {/* Hint */}
          <div style={{ textAlign: 'center', fontSize: 11, color: 'var(--color-neutral-500)', marginBottom: 6, fontWeight: 500 }}>
            {phase === 'start' ? 'Selecione a data inicial' : 'Selecione a data final'}
          </div>
          {/* Day headers */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', padding: '0 12px' }}>
            {DAYS.map(d => (
              <div key={d} style={{ textAlign: 'center', fontSize: 11, fontWeight: 600, color: 'var(--color-neutral-500)', padding: '4px 0' }}>{d}</div>
            ))}
          </div>
          {/* Days grid */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 2, padding: '4px 12px 8px' }}>
            {cells.map((date, i) => {
              if (!date) return <div key={`e${i}`} />;
              const isStart = isSameDay(date, startDate);
              const isEnd   = isSameDay(date, endDate);
              const isToday = date.toDateString() === todayStr;
              const rangeEnd = phase === 'end' && hoverDate ? hoverDate : endDate;
              let inRange = false;
              if (startDate && rangeEnd) {
                const lo = startDate < rangeEnd ? startDate : rangeEnd;
                const hi = startDate < rangeEnd ? rangeEnd : startDate;
                inRange = date > lo && date < hi;
              }
              const isSelected = isStart || isEnd;
              return (
                <div key={date.toISOString()}
                  onClick={() => handleDayClick(date)}
                  onMouseEnter={() => phase === 'end' && setHoverDate(date)}
                  onMouseLeave={() => phase === 'end' && setHoverDate(null)}
                  style={{
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    height: 34, borderRadius: 6, cursor: 'pointer', fontSize: 13,
                    background: isSelected ? 'var(--color-primary-500)' : inRange ? 'var(--color-primary-100)' : 'transparent',
                    color: isSelected ? '#fff' : isToday ? 'var(--color-primary-600)' : 'var(--color-neutral-900)',
                    fontWeight: isSelected ? 700 : isToday ? 600 : 400,
                    transition: 'background .1s',
                    userSelect: 'none',
                  }}
                  onMouseOver={e => { if (!isSelected && !inRange) e.currentTarget.style.background = 'var(--color-neutral-200)'; }}
                  onMouseOut={e => {
                    if (!isSelected && !inRange) e.currentTarget.style.background = 'transparent';
                    else if (inRange) e.currentTarget.style.background = 'var(--color-primary-100)';
                  }}
                >{date.getDate()}</div>
              );
            })}
          </div>
          {/* Footer */}
          <div style={{ display: 'flex', justifyContent: 'flex-start', padding: '8px 16px 12px', borderTop: '1px solid var(--color-neutral-200)' }}>
            <button
              onClick={() => { onChange(null, null); setPhase('start'); }}
              style={{
                background: 'none', border: 'none', cursor: 'pointer',
                fontSize: 13, color: 'var(--color-neutral-600)', padding: '4px 8px',
                borderRadius: 4, fontFamily: 'var(--font-family-primary)',
                transition: 'color .1s',
              }}
              onMouseEnter={e => e.currentTarget.style.color = 'var(--color-primary-500)'}
              onMouseLeave={e => e.currentTarget.style.color = 'var(--color-neutral-600)'}
            >Limpar datas</button>
          </div>
        </div>,
        document.body
      )}
    </div>
  );
}

// ─── DateFilter — tipo de data + range picker ─────────────────────────────────
function DateFilter({ activeTab, flex }) {
  const [dateType,  setDateType]  = useInfState(null);
  const [startDate, setStartDate] = useInfState(null);
  const [endDate,   setEndDate]   = useInfState(null);
  const [open,      setOpen]      = useInfState(false);
  const [dropPos,   setDropPos]   = useInfState({});
  const [tooltip,   setTooltip]   = useInfState(null); // { text, x, y }
  const fieldRef = useInfRef(null);
  const dropRef  = useInfRef(null);

  const availableOpts = DATE_TYPE_OPTIONS.filter(o => o.tabs.includes(activeTab));

  useInfEffect(() => {
    if (dateType && !availableOpts.find(o => o.id === dateType)) setDateType(null);
  }, [activeTab]);

  const selectedLabel = availableOpts.find(o => o.id === dateType)?.label || null;

  function openDrop() {
    if (!fieldRef.current) return;
    const r = fieldRef.current.getBoundingClientRect();
    setDropPos({ top: r.bottom + 4, left: r.left, width: Math.max(r.width, 300) });
    setOpen(true);
  }

  useInfEffect(() => {
    if (!open) return;
    const h = (e) => {
      if (fieldRef.current && !fieldRef.current.contains(e.target) &&
          dropRef.current && !dropRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [open]);

  // Tooltip portal
  const tooltipEl = tooltip && ReactDOM.createPortal(
    <div style={{
      position: 'fixed', top: tooltip.y, left: tooltip.x, transform: 'translateX(-50%)',
      background: 'var(--color-neutral-900)', color: '#fff',
      fontSize: 12, padding: '5px 10px', borderRadius: 6,
      fontFamily: 'var(--font-family-primary)', whiteSpace: 'nowrap',
      zIndex: 99999, pointerEvents: 'none',
      boxShadow: '0 2px 8px rgba(0,0,0,0.2)',
    }}>{tooltip.text}</div>,
    document.body
  );

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 4, flex: flex || '0 0 auto', minWidth: flex ? 0 : 300 }}>
      <label style={filterLabelStyle}>Data</label>
      {tooltipEl}
      <div style={{ display: 'flex', alignItems: 'stretch', gap: 6 }}>
        {/* Type select — largura fixa, texto truncado */}
        <div ref={fieldRef} style={{ position: 'relative', flex: '1 1 0', minWidth: 0 }}>
          <div
            onClick={() => open ? setOpen(false) : openDrop()}
            onMouseEnter={e => {
              if (selectedLabel) {
                const r = e.currentTarget.getBoundingClientRect();
                setTooltip({ text: selectedLabel, x: r.left + r.width / 2, y: r.top - 34 });
              }
            }}
            onMouseLeave={() => setTooltip(null)}
            style={{
              display: 'flex', alignItems: 'center',
              height: 40, padding: '0 32px 0 12px', boxSizing: 'border-box',
              width: '100%',
              border: `1px solid ${open ? 'var(--color-primary-500)' : 'var(--color-neutral-400)'}`,
              borderRadius: 8, background: '#fff', cursor: 'pointer',
              fontFamily: 'var(--font-family-primary)', fontSize: 13,
              color: selectedLabel ? 'var(--color-neutral-1000)' : 'var(--color-neutral-700)',
              overflow: 'hidden',
              boxShadow: open ? '0 0 0 2px var(--color-primary-200)' : 'none',
              transition: 'border-color .15s, box-shadow .15s',
            }}
          >
            <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {selectedLabel || 'Tipo de data'}
            </span>
            {selectedLabel ? (

function CompanyTreeSelect({ label, placeholder, value, onChange, flex, minWidth }) {

  const [isTyping, setIsTyping] = useInfState(false);
  const [open,    setOpen]    = useInfState(false);
  const [focused, setFocused] = useInfState(false);
  const [dropRect, setDropRect] = useInfState(null);
  const wrapRef  = useInfRef(null);
  const inputRef = useInfRef(null);

  const flat = window.flattenEmpresaTree(window.MOCK_EMPRESA_TREE);
  const filtered = isTyping && query.trim()
    ? flat.filter(n => n.label.toLowerCase().includes(query.toLowerCase()))
    : flat;

  // Texto mostrado no input
  const displayValue = isTyping ? query : (value || '');

  function openDropdown() {
    if (wrapRef.current) {
      const r = wrapRef.current.getBoundingClientRect();
      setDropRect({ top: r.bottom + 4, left: r.left, width: Math.max(r.width, 260) });
    }
    setOpen(true);
  }

  function handleFocus() {
    setFocused(true);
    setIsTyping(false);
    setQuery('');
    openDropdown();
  }

  function handleChange(e) {
    setIsTyping(true);
    setQuery(e.target.value);
    openDropdown();
  }

  function handleSelect(node) {
    onChange(node.label);
    setIsTyping(false);
    setQuery('');
    setOpen(false);
    inputRef.current?.blur();
  }

  function handleClear(e) {
    e.preventDefault();
    onChange('');
    setIsTyping(false);
    setQuery('');
    setOpen(false);
  }

  useInfEffect(() => {
    if (!open) return;
    const h = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) {
        setOpen(false);
        setIsTyping(false);
        setQuery('');
        setFocused(false);
      }
    };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [open]);

  const INDENT_PX = [0, 20, 34];

  return (
    <div ref={wrapRef} style={{ display: 'flex', flexDirection: 'column', gap: 4, flex, minWidth }}>
      <label style={filterLabelStyle}>{label}</label>
      <div style={{
        position: 'relative', display: 'flex', alignItems: 'center',
        border: `1px solid ${focused || open ? 'var(--color-primary-500)' : 'var(--color-neutral-400)'}`,
        borderRadius: 8, background: 'var(--color-neutral-100)', height: 40,
        boxShadow: focused || open ? '0 0 0 3px var(--color-primary-100)' : 'none',
        transition: 'border-color .15s, box-shadow .15s',
      }}>
        <input
          ref={inputRef}
          className="inf-placeholder-input"
          value={displayValue}
          placeholder={placeholder}
          onFocus={handleFocus}
          onBlur={() => setFocused(false)}
          onChange={handleChange}
          style={{
            flex: 1, border: 'none', outline: 'none', background: 'transparent',
            fontFamily: 'var(--font-family-primary)', fontSize: 14,
            color: 'var(--color-neutral-900)', padding: '0 32px 0 16px',
            height: '100%', width: '100%',
          }}
        />
        {value ? (
          <span onMouseDown={handleClear} style={{
            position: 'absolute', right: 10, top: '50%', transform: 'translateY(-50%)',
            color: 'var(--color-neutral-500)', display: 'inline-flex', cursor: 'pointer',
          }}><IconX /></span>
        ) : (
          <span style={{
            position: 'absolute', right: 10, top: '50%',
            transform: `translateY(-50%) ${open ? 'rotate(180deg)' : 'rotate(0deg)'}`,
            color: 'var(--color-neutral-600)', display: 'inline-flex',
            pointerEvents: 'none', transition: 'transform .2s',
          }}><IconChevronDown /></span>
        )}
      </div>

      {open && filtered.length > 0 && dropRect && ReactDOM.createPortal(
        <div style={{
          position: 'fixed', top: dropRect.top, left: dropRect.left, width: dropRect.width,
          zIndex: 9999, background: '#fff',
          border: '1px solid var(--color-neutral-300)', borderRadius: 8,
          boxShadow: '0 8px 24px rgba(0,0,0,0.12)',
          maxHeight: 320, overflowY: 'auto',
        }}>
          {filtered.map(node => {
            const isSelected = value === node.label;
            const indent = INDENT_PX[node.level] || 0;
            return (
              <div
                key={node.id}
                onMouseDown={() => handleSelect(node)}
                style={{
                  display: 'flex', alignItems: 'center', gap: 6,
                  padding: `9px 12px 9px ${12 + indent}px`,
                  cursor: 'pointer',
                  background: isSelected ? 'var(--color-primary-100)' : 'transparent',
                  fontFamily: 'var(--font-family-primary)', fontSize: 13,
                  fontWeight: node.level === 0 ? 600 : 400,
                  color: isSelected ? 'var(--color-primary-600)' : 'var(--color-neutral-1000)',
                  borderBottom: node.level === 0 ? '0.5px solid var(--color-neutral-200)' : 'none',
                  transition: 'background .1s',
                }}
                onMouseEnter={e => { if (!isSelected) e.currentTarget.style.background = 'var(--color-neutral-100)'; }}
                onMouseLeave={e => { e.currentTarget.style.background = isSelected ? 'var(--color-primary-100)' : 'transparent'; }}
              >
                {node.level > 0 && (
                  <span style={{
                    width: 3, height: 3, borderRadius: '50%', flexShrink: 0,
                    background: node.level === 1 ? 'var(--color-neutral-500)' : 'var(--color-neutral-300)',
