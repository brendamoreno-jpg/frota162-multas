<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Multas — Frota 162</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<style>
/* =============================================================================
   Frota162 Design System — Core tokens
   Source of truth: frota-ds codebase (src/styles/_theme.scss)
   Use via CSS variables; everything maps 1:1 with the production tokens.
   ============================================================================= */

/* ---- Fonts ----------------------------------------------------------------- */
@font-face {
  font-family: 'Inter';
  src: url('fonts/Inter-VariableFont_opsz,wght.ttf') format('truetype-variations');
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Inter';
  src: url('fonts/Inter-Italic-VariableFont_opsz,wght.ttf') format('truetype-variations');
  font-weight: 100 900;
  font-style: italic;
  font-display: swap;
}

:root {
  /* === BRAND ============================================================== */
  --color-brand-primary-darkest: #431107;
  --color-brand-primary-dark:    #B02D13;
  --color-brand-primary-pure:    #F9401B;
  --color-brand-primary-light:   #FCA392;
  --color-brand-primary-lightest:#FEE0DB;

  --color-brand-secondary-darkest: #08150B;
  --color-brand-secondary-dark:    #16371D;
  --color-brand-secondary-pure:    #1F4D29;
  --color-brand-secondary-light:   #8CC194;
  --color-brand-secondary-lightest:#CAFFD3;

  /* === PRIMARY SCALE (brand red/orange) =================================== */
  --color-primary-100:  #fffbfb;
  --color-primary-200:  #feece8;
  --color-primary-300:  #fed9d1;
  --color-primary-400:  #fdb3a4;
  --color-primary-500:  #f9401b;  /* brand pure */
  --color-primary-600:  #c73316;
  --color-primary-700:  #952610;
  --color-primary-800:  #641a0b;
  --color-primary-900:  #320d05;
  --color-primary-1000: #270c06;

  /* === SECONDARY SCALE (muted green) ====================================== */
  --color-secondary-100:  #f3f9f4;
  --color-secondary-200:  #e8f3ea;
  --color-secondary-300:  #d1e6d4;
  --color-secondary-400:  #a3cda9;
  --color-secondary-500:  #8cc194;
  --color-secondary-600:  #739f79;
  --color-secondary-700:  #597d5f;
  --color-secondary-800:  #405c44;
  --color-secondary-900:  #263a2a;
  --color-secondary-1000: #1a291c;

  /* === NEUTRAL ============================================================ */
  --color-neutral-100:  #ffffff;
  --color-neutral-200:  #fafafa;
  --color-neutral-300:  #eceded;
  --color-neutral-400:  #ddddde;
  --color-neutral-500:  #bebec0;
  --color-neutral-600:  #9f9fa2;
  --color-neutral-700:  #606266;
  --color-neutral-800:  #4d4e52;
  --color-neutral-900:  #262729;
  --color-neutral-1000: #0a0a0a;

  /* === INFORMATION / BLUE ================================================= */
  --color-information-100:  #eaf3fd;
  --color-information-200:  #d4e7fc;
  --color-information-300:  #aad0f9;
  --color-information-400:  #7fb8f5;
  --color-information-500:  #55a1f2;
  --color-information-600:  #2a89ef;
  --color-information-700:  #226ebf;
  --color-information-800:  #19528f;
  --color-information-900:  #113760;
  --color-information-1000: #081b30;

  /* === SUCCESS / GREEN ==================================================== */
  --color-success-100:  #e8f9f2;
  --color-success-200:  #d0f2e4;
  --color-success-300:  #a1e5c9;
  --color-success-400:  #73d8ae;
  --color-success-500:  #44cb93;
  --color-success-600:  #15be78;
  --color-success-700:  #119860;
  --color-success-800:  #0d7248;
  --color-success-900:  #084c30;
  --color-success-1000: #042618;

  /* === ERROR / RED ======================================================== */
  --color-error-100:  #fde9eb;
  --color-error-200:  #fad2d6;
  --color-error-300:  #f5a5ad;
  --color-error-400:  #f07884;
  --color-error-500:  #eb4b5b;
  --color-error-600:  #e61e32;
  --color-error-700:  #b81828;
  --color-error-800:  #8a121e;
  --color-error-900:  #5c0c14;
  --color-error-1000: #2e060a;

  /* === WARNING / YELLOW =================================================== */
  --color-warning-100:  #fef7e7;
  --color-warning-200:  #feeecf;
  --color-warning-300:  #fddd9f;
  --color-warning-400:  #fbcd70;
  --color-warning-500:  #fabc40;
  --color-warning-600:  #f9ab10;
  --color-warning-700:  #c7890d;
  --color-warning-800:  #95670a;
  --color-warning-900:  #644406;
  --color-warning-1000: #322203;

  /* === SEMANTIC ALIASES =================================================== */
  --color-background-default: var(--color-neutral-100);
  --color-background-alt:     var(--color-neutral-200);
  --color-background-inverse: var(--color-neutral-900);

  --color-text-default:   var(--color-neutral-700);
  --color-text-strong:    var(--color-neutral-1000);
  --color-text-secondary: var(--color-neutral-500);
  --color-text-inverse:   var(--color-neutral-100);

  --color-border-default: var(--color-neutral-400);
  --color-border-hover:   var(--color-primary-500);
  --color-border-focus:   var(--color-primary-500);

  --color-feedback-success: var(--color-success-600);
  --color-feedback-error:   var(--color-error-600);
  --color-feedback-warning: var(--color-warning-600);
  --color-feedback-info:    var(--color-information-600);

  /* === SPACING (base unit: 2px) ========================================== */
  --spacing-0:   0px;
  --spacing-1x:  2px;
  --spacing-2x:  4px;
  --spacing-4x:  8px;
  --spacing-6x:  12px;
  --spacing-8x:  16px;
  --spacing-10x: 20px;
  --spacing-12x: 24px;
  --spacing-16x: 32px;
  --spacing-20x: 40px;
  --spacing-24x: 48px;
  --spacing-28x: 56px;
  --spacing-32x: 64px;
  --spacing-40x: 80px;

  --padding-0: 0; --padding-1x: 2px; --padding-2x: 4px; --padding-4x: 8px;
  --padding-6x: 12px; --padding-8x: 16px; --padding-10x: 20px; --padding-12x: 24px;
  --padding-16x: 32px; --padding-20x: 40px; --padding-24x: 48px;
  --gap-0: 0; --gap-1x: 2px; --gap-2x: 4px; --gap-4x: 8px; --gap-6x: 12px;
  --gap-8x: 16px; --gap-10x: 20px; --gap-12x: 24px; --gap-16x: 32px;

  /* === BORDER RADIUS ===================================================== */
  --border-radius-none: 0;
  --border-radius-xsm:  4px;
  --border-radius-sm:   8px;
  --border-radius-md:   16px;
  --border-radius-lg:   24px;
  --border-radius-pill: 500px;

  /* === BORDER WIDTH ====================================================== */
  --border-width-none: 0;
  --border-width-sm:   1px;
  --border-width-md:   2px;
  --border-width-lg:   4px;

  /* === SHADOWS =========================================================== */
  --shadow-none:    none;
  --shadow-level-1: 2px 2px 8px  0 rgba(0,0,0,0.08);
  --shadow-level-2: 2px 4px 24px 0 rgba(0,0,0,0.16);
  --shadow-level-3: 2px 8px 32px 0 rgba(0,0,0,0.16);
  --shadow-level-4: 2px 8px 48px 0 rgba(0,0,0,0.32);

  /* === TYPOGRAPHY ======================================================== */
  --font-family-primary: 'Inter', system-ui, -apple-system, sans-serif;

  --font-weight-light:   300;
  --font-weight-regular: 400;
  --font-weight-medium:  600;
  --font-weight-bold:    700;

  --line-height-near:    1;
  --line-height-compact: 1.2;
  --line-height-far:     1.5;

  /* Display */
  --font-size-display-large:   56px;
  --font-size-display-medium:  48px;
  --font-size-display-small:   40px;
  --line-height-display-large:  56px;
  --line-height-display-medium: 48px;
  --line-height-display-small:  40px;

  /* Heading */
  --font-size-h1: 32px;  --line-height-h1: 38.4px;
  --font-size-h2: 24px;  --line-height-h2: 36px;
  --font-size-h3: 20px;  --line-height-h3: 30px;
  --font-size-h4: 18px;  --line-height-h4: 27px;
  --font-size-h5: 16px;  --line-height-h5: 24px;

  /* Body */
  --font-size-body-large:  18px;  --line-height-body-large:  27px;
  --font-size-body-medium: 16px;  --line-height-body-medium: 24px;
  --font-size-body-small:  14px;  --line-height-body-small:  21px;
  --font-size-body-xsmall: 12px;  --line-height-body-xsmall: 18px;

  /* Caption */
  --font-size-caption-medium: 12px; --line-height-caption-medium: 18px;
  --font-size-caption-small:  10px; --line-height-caption-small:  14px;

  --letter-spacing-tight:  -0.02em;
  --letter-spacing-normal: 0;
  --letter-spacing-wide:   0.05em;
}

/* =============================================================================
   SEMANTIC ELEMENT STYLES — use these on plain HTML inside a .frota-doc scope
   ============================================================================= */
.frota-doc {
  font-family: var(--font-family-primary);
  font-size: var(--font-size-body-medium);
  line-height: var(--line-height-body-medium);
  color: var(--color-text-default);
  background: var(--color-background-default);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.frota-doc h1, .frota-display-lg {
  font-size: var(--font-size-display-large);
  line-height: var(--line-height-display-large);
  font-weight: var(--font-weight-bold);
  color: var(--color-text-strong);
  letter-spacing: var(--letter-spacing-tight);
  margin: 0;
}
.frota-doc h2 {
  font-size: var(--font-size-h1);
  line-height: var(--line-height-h1);
  font-weight: var(--font-weight-bold);
  color: var(--color-text-strong);
  margin: 0;
}
.frota-doc h3 {
  font-size: var(--font-size-h2);
  line-height: var(--line-height-h2);
  font-weight: var(--font-weight-bold);
  color: var(--color-text-strong);
  margin: 0;
}
.frota-doc h4 {
  font-size: var(--font-size-h3);
  line-height: var(--line-height-h3);
  font-weight: var(--font-weight-bold);
  color: var(--color-text-strong);
  margin: 0;
}
.frota-doc p {
  font-size: var(--font-size-body-medium);
  line-height: var(--line-height-body-medium);
  margin: 0;
}
.frota-doc small, .frota-caption {
  font-size: var(--font-size-caption-medium);
  line-height: var(--line-height-caption-medium);
  color: var(--color-text-secondary);
}
.frota-doc code, .frota-doc pre {
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: var(--font-size-body-small);
  background: var(--color-neutral-200);
  border: 1px solid var(--color-neutral-300);
  border-radius: var(--border-radius-xsm);
  padding: 1px 6px;
  color: var(--color-neutral-900);
}

</style>
<style>
/* Portal UI kit — Frota 162
   Fiel aos SCSS de frota-ds/src/components/.
   Tokens: --padding-Nx, --gap-Nx, --border-radius-*, --shadow-level-*, --color-*. */


* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: var(--font-family-primary);
  color: var(--color-neutral-1000);
  background: var(--color-neutral-200);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
}

/* =========================================================================
   SHELL
   ========================================================================= */
.app-shell { display: flex; flex-direction: column; min-height: 100vh; }
.app-below-header { display: flex; flex: 1; min-height: 0; }
.app-main  { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.app-body  {
  flex: 1; padding: var(--padding-12x) var(--padding-16x);
  background: var(--color-neutral-200);
  overflow: auto;
}

/* =========================================================================
   HEADER — mirrors organisms/header/Header.scss
   ========================================================================= */
.frota-header {
  width: 100%;
  box-sizing: border-box;
  display: flex; align-items: center; justify-content: space-between;
  min-height: 64px;
  padding: var(--padding-4x) var(--padding-6x);
  background-color: var(--color-background-default, var(--color-neutral-100));
  border-bottom: var(--border-width-sm) solid var(--color-border-default, var(--color-neutral-300));
  box-shadow: var(--shadow-level-1);
  position: sticky; top: 0; z-index: 100;
}
.frota-header__desktop {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  gap: var(--gap-4x);
}
.frota-header__logo { display: flex; align-items: center; flex-shrink: 0; }
.frota-header__logo img { height: 32px; width: auto; display: block; }

.frota-header__banner {
  display: flex; align-items: center; gap: var(--gap-4x);
  padding: var(--padding-2x) var(--padding-4x);
  background-color: var(--color-primary-100);
  border-radius: var(--border-radius-md);
  flex: 1; max-width: 480px; margin: 0 auto;
  font-size: var(--font-size-body-xsmall);
  color: var(--color-neutral-1000);
}
.frota-header__banner-tag {
  display: inline-flex; align-items: center;
  padding: var(--padding-1x) var(--padding-4x);
  border-radius: var(--border-radius-pill);
  background: var(--color-primary-500); color: var(--color-neutral-100);
  font-size: var(--font-size-caption-small); font-weight: var(--font-weight-bold);
  text-transform: uppercase; letter-spacing: 0;
}

.frota-header__actions {
  display: flex; align-items: center; gap: var(--gap-4x); flex-shrink: 0;
}

/* Balance */
.frota-header__balance {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--gap-2x);
  height: 40px;
  padding: var(--padding-2x) var(--padding-4x) var(--padding-2x) var(--padding-6x);
  background-color: var(--color-neutral-100);
  border: var(--border-width-sm) solid var(--color-neutral-400);
  border-radius: var(--border-radius-sm);
  cursor: pointer; font-family: inherit;
  transition: background-color .15s, border-color .15s;
}
.frota-header__balance:hover { background-color: var(--color-neutral-200); }
.frota-header__balance-content { display: flex; align-items: center; gap: var(--gap-2x); }
.frota-header__balance-label,
.frota-header__balance-value {
  font-family: var(--font-family-primary);
  font-size: var(--font-size-body-small);
  font-weight: var(--font-weight-bold);
  line-height: var(--line-height-body-small);
  color: var(--color-neutral-1000); white-space: nowrap;
}
.frota-header__balance-icon {
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; width: 32px; height: 32px; color: var(--color-neutral-1000);
}

.frota-header__divider {
  width: var(--border-width-sm); height: 24px;
  background-color: var(--color-border-default, var(--color-neutral-300));
  flex-shrink: 0;
}

.frota-header__dropdown-wrapper { position: relative; }
.frota-header__account-trigger {
  display: flex; align-items: center; gap: var(--gap-4x);
  padding: var(--padding-2x) var(--padding-4x);
  border: none; background: none; cursor: pointer;
  border-radius: var(--border-radius-sm);
  color: var(--color-neutral-1000); font-family: inherit;
  font-size: var(--font-size-body-small); font-weight: var(--font-weight-bold);
}
.frota-header__account-trigger:hover { background-color: var(--color-neutral-200); }

.frota-header__dropdown {
  position: absolute;
  top: calc(100% + var(--padding-2x));
  right: 0;
  min-width: 280px;
  display: flex; flex-direction: column; gap: var(--gap-4x);
  padding: var(--padding-4x);
  background-color: var(--color-neutral-100);
  border-radius: var(--border-radius-sm);
  box-shadow: var(--shadow-level-1);
  z-index: 200;
}
.frota-header__dropdown-divider {
  height: var(--border-width-sm); background-color: var(--color-neutral-300);
  border: none; margin: 0; flex-shrink: 0;
}
.frota-header__notification { position: relative; }
.frota-header__notification .frota-icon-button { color: var(--color-primary-500); }
.frota-header__notification .frota-badge__indicator--top-right { top: 4px; right: 4px; }

/* =========================================================================
   SIDEBAR
   ========================================================================= */
.frota-sidebar {
  width: 64px;
  background: var(--color-neutral-100);
  border-right: var(--border-width-sm) solid var(--color-neutral-300);
  padding: var(--padding-8x) var(--padding-6x);
  display: flex; flex-direction: column;
  transition: width .2s ease;
  position: sticky; top: 0; align-self: stretch;
}
.frota-sidebar.expanded { width: 240px; }
.frota-sidebar__nav { display: flex; flex-direction: column; gap: var(--gap-2x); flex: 1; }
.frota-sidebar__footer {
  padding-top: var(--padding-6x);
  border-top: var(--border-width-sm) solid var(--color-neutral-300);
}
.frota-sidebar__item {
  display: flex; align-items: center; gap: var(--gap-6x);
  padding: var(--padding-6x);
  background: transparent; border: none; cursor: pointer;
  border-radius: var(--border-radius-sm);
  color: var(--color-neutral-800);
  font-family: inherit;
  font-size: var(--font-size-body-small);
  font-weight: var(--font-weight-medium);
  text-align: left; width: 100%;
  white-space: nowrap; overflow: hidden;
  transition: background-color .15s, color .15s;
}
.frota-sidebar__item:hover {
  background: var(--color-primary-200);
  color: var(--color-primary-500);
}
.frota-sidebar__item.active {
  background: var(--color-primary-200);
  color: var(--color-primary-500);
  font-weight: var(--font-weight-bold);
}
.frota-sidebar__icon {
  width: 24px; height: 24px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
.frota-sidebar__label { opacity: 0; transition: opacity .15s; flex: 1; }
.frota-sidebar.expanded .frota-sidebar__label { opacity: 1; }

/* =========================================================================
   BUTTON — atoms/button/Button.scss
   ========================================================================= */
.frota-button {
  appearance: none;
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--gap-4x);
  box-sizing: border-box;
  height: 40px;
  padding: var(--padding-6x) var(--padding-8x);
  border: var(--border-width-sm) solid transparent;
  border-radius: var(--border-radius-sm);
  background: transparent;
  color: var(--color-neutral-1000);
  font-family: var(--font-family-primary);
  font-size: var(--font-size-body-small); font-weight: var(--font-weight-bold);
  line-height: 1;
  white-space: nowrap; cursor: pointer;
  transition: background-color .15s, border-color .15s, color .15s;
}
.frota-button--small  { height: 32px; padding: var(--padding-4x) var(--padding-6x); font-size: var(--font-size-body-xsmall); }
.frota-button--medium { height: 40px; padding: var(--padding-6x) var(--padding-8x); font-size: var(--font-size-body-small); }
.frota-button--large  { height: 48px; padding: var(--padding-8x) var(--padding-10x); font-size: var(--font-size-body-medium); }
.frota-button--full   { width: 100%; }

.frota-button--primary {
  background: var(--color-primary-500); border-color: var(--color-primary-500); color: var(--color-neutral-100);
}
.frota-button--primary:hover  { background: var(--color-primary-600); border-color: var(--color-primary-600); }
.frota-button--primary:active { background: var(--color-primary-700); border-color: var(--color-primary-700); }

.frota-button--secondary {
  background: var(--color-neutral-100); border-color: var(--color-neutral-400); color: var(--color-neutral-1000);
}
.frota-button--secondary:hover  { background: var(--color-primary-200); border-color: var(--color-primary-500); color: var(--color-primary-500); }

.frota-button--ghost, .frota-button--tertiary {
  background: transparent; border-color: transparent; color: var(--color-neutral-1000);
}
.frota-button--ghost:hover, .frota-button--tertiary:hover {
  background: var(--color-primary-200); color: var(--color-primary-500);
}

.frota-button--destructive {
  background: transparent; border-color: var(--color-error-600); color: var(--color-error-600);
}
.frota-button--destructive:hover { background: var(--color-error-100); }

.frota-button:disabled,
.frota-button--disabled {
  background: var(--color-neutral-300) !important;
  border-color: var(--color-neutral-400) !important;
  color: var(--color-neutral-700) !important;
  cursor: not-allowed;
}

/* =========================================================================
   ICON BUTTON — atoms/iconButton/IconButton.scss
   ========================================================================= */
.frota-icon-button {
  appearance: none; border: none; outline: none; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  box-sizing: border-box; line-height: 1; user-select: none;
  background-color: transparent; padding: 0;
  transition: background-color .2s, border-color .2s, color .2s;
  color: var(--color-neutral-1000);
}
.frota-icon-button--medium { width: 40px; height: 40px; padding: var(--padding-5x, 10px); }
.frota-icon-button--medium svg { width: 20px; height: 20px; }
.frota-icon-button--small  { width: 32px; height: 32px; padding: var(--padding-4x); }
.frota-icon-button--small svg { width: 16px; height: 16px; }

.frota-icon-button--rounded {
  border-radius: var(--border-radius-pill);
  background-color: var(--color-neutral-100);
  border: var(--border-width-sm) solid var(--color-neutral-400);
}
.frota-icon-button--rounded:hover:not(:disabled) {
  background-color: var(--color-primary-200);
  border-color: var(--color-primary-400);
  color: var(--color-primary-500);
}

.frota-icon-button--outlined {
  border-radius: var(--border-radius-sm);
  background-color: var(--color-neutral-100);
  border: var(--border-width-sm) solid var(--color-neutral-400);
}
.frota-icon-button--outlined:hover:not(:disabled) {
  background-color: var(--color-primary-200);
  border-color: var(--color-primary-400);
  color: var(--color-primary-500);
}

.frota-icon-button--ghost {
  border-radius: var(--border-radius-sm);
  background-color: transparent; border: none;
}
.frota-icon-button--ghost:hover:not(:disabled) {
  background-color: var(--color-primary-200);
  color: var(--color-primary-500);
}

.frota-icon-button--primary { color: var(--color-primary-500); }
.frota-icon-button--neutral { color: var(--color-neutral-1000); }

/* =========================================================================
   AVATAR — atoms/avatar/Avatar.scss
   ========================================================================= */
.frota-avatar {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--border-radius-pill);
  overflow: hidden; flex-shrink: 0; border: none; padding: 0;
  font: inherit; color: inherit;
  font-family: var(--font-family-primary);
  font-weight: var(--font-weight-regular);
  text-align: center; white-space: nowrap;
}
.frota-avatar--small  { width: 24px; height: 24px; font-size: var(--font-size-body-xsmall); line-height: var(--line-height-body-xsmall); }
.frota-avatar--medium { width: 32px; height: 32px; font-size: var(--font-size-body-small);  line-height: var(--line-height-body-small); }
.frota-avatar--large  { width: 40px; height: 40px; font-size: var(--font-size-body-medium); line-height: var(--line-height-body-medium); }
.frota-avatar--initials { background-color: var(--color-neutral-1000); color: var(--color-neutral-100); }
.frota-avatar--fallback { background-color: var(--color-neutral-300); color: var(--color-neutral-600); }

/* =========================================================================
   BADGE — atoms/badge/Badge.scss
   ========================================================================= */
.frota-badge { position: relative; display: inline-flex; vertical-align: middle; width: fit-content; }
.frota-badge__indicator {
  position: absolute;
  display: flex; align-items: center; justify-content: center;
  min-height: 16px; min-width: 16px;
  padding: 0 var(--padding-2x);
  border-radius: var(--border-radius-pill);
  font-family: var(--font-family-primary);
  font-size: var(--font-size-caption-small);
  font-weight: var(--font-weight-bold); line-height: 1;
  text-align: center; text-transform: uppercase; white-space: nowrap;
  box-sizing: border-box; z-index: 1; pointer-events: none;
}
.frota-badge__indicator--primary { background-color: var(--color-primary-500); color: var(--color-neutral-100); }
.frota-badge__indicator--error   { background-color: var(--color-error-700);   color: var(--color-neutral-100); }
.frota-badge__indicator--warning { background-color: var(--color-warning-500); color: var(--color-neutral-1000); }
.frota-badge__indicator--info    { background-color: var(--color-information-600); color: var(--color-neutral-100); }
.frota-badge__indicator--success { background-color: var(--color-success-600); color: var(--color-neutral-100); }
.frota-badge__indicator--neutral { background-color: var(--color-neutral-400); color: var(--color-neutral-1000); }
.frota-badge__indicator--dot { padding: 0; min-width: 8px; min-height: 8px; width: 8px; height: 8px; }
.frota-badge__indicator--top-right { top: 0; right: 0; transform: translate(50%, -50%); }

/* =========================================================================
   TAG — atoms/tag/Tag.scss (uppercase, pill, caption)
   ========================================================================= */
.frota-tag {
  display: inline-flex; align-items: center; justify-content: center;
  width: fit-content; max-width: 100%;
  padding: var(--padding-1x) var(--padding-4x);
  border-radius: var(--border-radius-pill);
  font-family: var(--font-family-primary);
  font-size: var(--font-size-caption-medium);
  font-weight: var(--font-weight-bold);
  line-height: var(--line-height-near);
  text-align: center; text-transform: uppercase; white-space: nowrap;
}
.frota-tag--primary.frota-tag--accent-off   { background: var(--color-primary-200);    color: var(--color-primary-800); }
.frota-tag--primary.frota-tag--accent-on    { background: var(--color-primary-500);    color: var(--color-neutral-100); }
.frota-tag--neutral.frota-tag--accent-off   { background: var(--color-neutral-300);    color: var(--color-neutral-800); }
.frota-tag--neutral.frota-tag--accent-on    { background: var(--color-neutral-800);    color: var(--color-neutral-100); }
.frota-tag--info.frota-tag--accent-off      { background: var(--color-information-200); color: var(--color-information-800); }
.frota-tag--info.frota-tag--accent-on       { background: var(--color-information-600); color: var(--color-neutral-100); }
.frota-tag--success.frota-tag--accent-off   { background: var(--color-success-200);    color: var(--color-success-800); }
.frota-tag--success.frota-tag--accent-on    { background: var(--color-success-600);    color: var(--color-neutral-100); }
.frota-tag--warning.frota-tag--accent-off   { background: var(--color-warning-200);    color: var(--color-warning-800); }
.frota-tag--warning.frota-tag--accent-on    { background: var(--color-warning-600);    color: var(--color-warning-1000); }
.frota-tag--error.frota-tag--accent-off     { background: var(--color-error-200);      color: var(--color-error-800); }
.frota-tag--error.frota-tag--accent-on      { background: var(--color-error-600);      color: var(--color-neutral-100); }

/* =========================================================================
   CHIP — atoms/chip/Chip.scss
   ========================================================================= */
.frota-chip {
  display: inline-flex; align-items: center; gap: var(--gap-2x);
  padding: var(--padding-4x);
  border-radius: var(--border-radius-sm);
  border: var(--border-width-sm) solid var(--color-neutral-400);
  background-color: var(--color-neutral-100);
  font-family: var(--font-family-primary);
  font-weight: var(--font-weight-regular);
  font-size: var(--font-size-body-xsmall);
  line-height: var(--line-height-compact);
  cursor: default; user-select: none;
}
.frota-chip__icon { display: inline-flex; width: 16px; height: 16px; flex-shrink: 0; }
.frota-chip__icon svg { width: 100%; height: 100%; }
.frota-chip--neutral      .frota-chip__icon svg { color: var(--color-neutral-1000); }
.frota-chip--primary      .frota-chip__icon svg { color: var(--color-primary-500); }
.frota-chip--green        .frota-chip__icon svg { color: var(--color-success-600); }
.frota-chip--yellow       .frota-chip__icon svg { color: var(--color-warning-600); }
.frota-chip--red          .frota-chip__icon svg { color: var(--color-error-600); }
.frota-chip--blue         .frota-chip__icon svg { color: var(--color-information-600); }
.frota-chip--selected     { font-weight: var(--font-weight-medium); }
.frota-chip--primary.frota-chip--selected { background: var(--color-primary-200);     border-color: var(--color-primary-500); }
.frota-chip--green.frota-chip--selected   { background: var(--color-success-200);     border-color: var(--color-success-600); }
.frota-chip--yellow.frota-chip--selected  { background: var(--color-warning-200);     border-color: var(--color-warning-600); }
.frota-chip--red.frota-chip--selected     { background: var(--color-error-200);       border-color: var(--color-error-600); }
.frota-chip--blue.frota-chip--selected    { background: var(--color-information-200); border-color: var(--color-information-600); }
.frota-chip--neutral.frota-chip--selected { background: var(--color-neutral-200);     border-color: var(--color-neutral-1000); }
.frota-chip--clickable    { cursor: pointer; transition: box-shadow .2s, transform .2s; }
.frota-chip--clickable:hover:not(.frota-chip--disabled) { box-shadow: 0 2px 4px rgba(0,0,0,.1); transform: translateY(-1px); }

/* =========================================================================
   INPUT — molecules/input/Input.scss
   ========================================================================= */
.frota-input-wrapper {
  display: inline-flex; flex-direction: column; position: relative;
  width: 100%;
}
.frota-input__label {
  margin-bottom: var(--padding-2x);
  font-family: var(--font-family-primary);
  font-size: var(--font-size-body-xsmall);
  font-weight: var(--font-weight-bold);
  color: var(--color-neutral-900);
}
.frota-input__control-container {
  display: flex; align-items: center;
  border: var(--border-width-sm) solid var(--color-neutral-400);
  border-radius: var(--border-radius-xsm);
  background-color: var(--color-neutral-100);
  height: 42px;
  padding: var(--padding-4x) 13px;
  box-sizing: border-box;
  transition: border-color .2s, box-shadow .2s;
}
.frota-input__control-container:focus-within {
  border-color: var(--color-primary-500);
  box-shadow: 0 0 0 2px var(--color-primary-200);
}
.frota-input {
  flex: 1; border: none; outline: none; background: transparent;
  color: var(--color-neutral-1000); padding: 0; width: 100%;
  font-family: var(--font-family-primary);
  font-size: var(--font-size-body-small);
  line-height: var(--line-height-far);
}
.frota-input::placeholder { color: var(--color-neutral-600); }
.frota-input__icon {
  display: flex; align-items: center; justify-content: center;
  color: var(--color-neutral-700);
}
.frota-input__icon--start { margin-right: var(--gap-4x); }
.frota-input__icon--end   { margin-left: var(--gap-4x); }
.frota-input__icon svg { width: 18px; height: 18px; }

/* Select (cosmetic — mimics readonly input) */
.frota-select {
  display: flex; align-items: center; justify-content: space-between;
  height: 42px;
  padding: var(--padding-4x) 13px;
  border: var(--border-width-sm) solid var(--color-neutral-400);
  border-radius: var(--border-radius-xsm);
  background: var(--color-neutral-100);
  font-size: var(--font-size-body-small);
  color: var(--color-neutral-1000);
  cursor: pointer;
}

/* =========================================================================
   TABS — atoms/tabs/Tabs.scss (underline style)
   ========================================================================= */
.frota-tabs {
  display: flex;
  height: 40px;
  align-items: flex-start;
  border-bottom: var(--border-width-sm) solid var(--color-neutral-300);
}
.frota-tabs__tab {
  display: flex; height: 40px; align-items: center;
  background: none; border: none;
  border-bottom: 3px solid transparent;
  color: var(--color-neutral-700);
  cursor: pointer;
  padding: 0 var(--padding-8x);
  font-family: var(--font-family-primary);
  font-size: var(--font-size-body-medium);
  font-weight: var(--font-weight-bold);
  line-height: var(--line-height-body-medium);
  transition: color .15s, border-color .15s;
}
.frota-tabs__tab--active {
  border-bottom-color: var(--color-primary-500);
  color: var(--color-primary-500);
}
.frota-tabs__tab:hover:not(.frota-tabs__tab--active) {
  border-bottom-color: var(--color-primary-500);
  color: var(--color-primary-500);
}

/* =========================================================================
   CARD — molecules/card/Card.scss
   ========================================================================= */
.frota-card {
  display: flex; flex-direction: column;
  box-sizing: border-box;
  min-width: 275px;
  overflow: hidden;
  position: relative;
  background: var(--color-neutral-100);
  border-radius: var(--border-radius-md);
  border: var(--border-width-sm) solid var(--color-border-default, var(--color-neutral-300));
  box-shadow: var(--shadow-level-1);
  transition: box-shadow .2s ease, transform .2s ease;
}
.frota-card:hover { box-shadow: var(--shadow-level-2); }

.frota-card__header {
  display: flex; flex-direction: column; gap: 6px;
  padding: var(--padding-12x);
}
.frota-card__title {
  margin: 0;
  font-family: var(--font-family-primary);
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: var(--line-height-compact);
}
.frota-card__description {
  margin: 0;
  font-family: var(--font-family-primary);
  font-size: var(--font-size-body-small);
  opacity: .85;
}
.frota-card__content { padding: var(--padding-12x); padding-top: 0; }
.frota-card__footer  { display: flex; align-items: center; padding: var(--padding-12x); padding-top: 0; }

.frota-card__kpi {
  display: flex; flex-direction: column; gap: 10px;
  padding: 18px 20px;
}
.frota-card__kpi-top { display: flex; align-items: center; gap: 10px; }
.frota-card__kpi-icon {
  width: 28px; height: 28px;
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.frota-card__kpi-label {
  font-family: var(--font-family-primary);
  font-size: var(--font-size-caption-medium);
  font-weight: var(--font-weight-medium);
  text-transform: uppercase; opacity: .9;
  color: var(--color-neutral-700);
  letter-spacing: 0.02em;
}
.frota-card__kpi-value {
  font-family: var(--font-family-primary);
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-bold);
  line-height: 1.1;
  color: var(--color-neutral-1000);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
.frota-card__kpi-subtitle {
  font-family: var(--font-family-primary);
  font-size: var(--font-size-caption-medium);
  opacity: .9; line-height: 1.35;
  color: var(--color-neutral-700);
}
.frota-card__kpi-subtitle.up   { color: var(--color-success-700); font-weight: var(--font-weight-medium); }
.frota-card__kpi-subtitle.down { color: var(--color-error-700);   font-weight: var(--font-weight-medium); }

/* =========================================================================
   TABLE V1 — organisms/table-v1/TableV1.scss
   ========================================================================= */
.frota-table-v1 {
  display: flex; flex-direction: column; width: 100%;
  border-radius: var(--border-radius-sm);
  border: var(--border-width-sm) solid var(--color-border-default, var(--color-neutral-300));
  overflow: hidden;
  background: var(--color-neutral-100);
}
.frota-table-v1__wrapper { width: 100%; overflow-x: auto; }
.frota-table-v1__table { width: 100%; border-collapse: collapse; }

.frota-table-v1__head-row {
  background: var(--color-neutral-200);
  border-bottom: var(--border-width-sm) solid var(--color-neutral-400);
}
.frota-table-v1__th {
  height: 48px;
  padding: 0 var(--padding-6x);
  vertical-align: middle;
  text-align: left;
  white-space: nowrap;
  color: var(--color-neutral-800);
  font-family: var(--font-family-primary);
  font-size: var(--font-size-caption-medium);
  font-weight: var(--font-weight-bold);
  line-height: var(--line-height-caption-medium);
  text-transform: uppercase;
}
.frota-table-v1__th--selection { width: 48px; text-align: center; }
.frota-table-v1__th--actions   { text-align: right; }

.frota-table-v1__row {
  border-bottom: var(--border-width-sm) solid var(--color-neutral-300);
  transition: background-color .15s ease;
}
.frota-table-v1__row:hover { background-color: var(--color-neutral-200); }
.frota-table-v1__row:last-child { border-bottom: none; }

.frota-table-v1__td {
  padding: var(--padding-6x);
  vertical-align: middle;
  background: transparent;
  color: var(--color-neutral-800);
  font-family: var(--font-family-primary);
  font-size: var(--font-size-body-small);
  font-weight: var(--font-weight-regular);
  line-height: var(--line-height-body-small);
}
.frota-table-v1__td--selection { width: 48px; padding: 0; text-align: center; }
.frota-table-v1__td--actions   { text-align: right; }
.frota-table-v1__td--mono      { font-variant-numeric: tabular-nums; font-weight: var(--font-weight-medium); }

.frota-table-v1__actions {
  display: flex; gap: var(--gap-2x); justify-content: flex-end; align-items: center;
}

.frota-table-v1__radio {
  width: 16px; height: 16px; cursor: pointer;
  accent-color: var(--color-primary-500);
}

/* Footer/pagination */
.frota-table-v1__footer {
  display: flex;
  padding: var(--padding-6x) var(--padding-8x);
  justify-content: space-between; align-items: center;
  background: var(--color-neutral-100);
  border-top: var(--border-width-sm) solid var(--color-border-default, var(--color-neutral-300));
}
.frota-table-v1__page-size { display: flex; align-items: center; gap: var(--gap-4x); }
.frota-table-v1__page-size-select {
  padding: var(--padding-2x) var(--padding-4x);
  border: var(--border-width-sm) solid var(--color-neutral-300);
  border-radius: var(--border-radius-xsm);
  background: var(--color-neutral-100);
  color: var(--color-neutral-1000);
  font-family: var(--font-family-primary);
  font-size: var(--font-size-body-small);
  font-weight: var(--font-weight-bold);
  cursor: pointer;
}
.frota-table-v1__pagination { display: flex; align-items: center; gap: var(--gap-4x); }
.frota-table-v1__pagination-info--range {
  font-weight: var(--font-weight-bold);
  color: var(--color-neutral-1000);
  font-size: var(--font-size-body-small);
}
.frota-table-v1__pagination-info--total {
  color: var(--color-neutral-700);
  font-size: var(--font-size-body-small);
}
.frota-table-v1__pagination-nav { display: flex; align-items: center; gap: var(--gap-2x); }
.frota-table-v1__pagination-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px;
  padding: 0 var(--padding-6x);
  border: var(--border-width-sm) solid var(--color-neutral-400);
  border-radius: var(--border-radius-sm);
  background: var(--color-neutral-100);
  color: var(--color-neutral-700);
  font-family: var(--font-family-primary);
  font-size: var(--font-size-body-small);
  cursor: pointer;
  transition: all .15s ease;
}
.frota-table-v1__pagination-btn:hover:not(:disabled) {
  border-color: var(--color-primary-500);
  color: var(--color-primary-500);
}
.frota-table-v1__pagination-btn:disabled { opacity: .4; cursor: not-allowed; }
.frota-table-v1__pagination-btn--active {
  background: var(--color-primary-500);
  border-color: var(--color-primary-500);
  color: var(--color-neutral-100);
  font-weight: var(--font-weight-bold);
}
.frota-table-v1__pagination-ellipsis {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px;
  color: var(--color-neutral-700);
  font-size: var(--font-size-body-small);
}

/* =========================================================================
   DROPDOWN — molecules/dropdown/Dropdown.scss
   ========================================================================= */
.frota-dropdown-menu {
  position: absolute; top: calc(100% + var(--padding-2x)); right: 0;
  min-width: 280px;
  padding: var(--padding-2x) 0;
  list-style: none; margin: 0;
  background: var(--color-neutral-100);
  border-radius: var(--border-radius-sm);
  box-shadow: var(--shadow-level-1);
  z-index: 200;
}
.frota-dropdown-menu__item {
  display: flex; align-items: center;
  padding: var(--padding-6x) var(--padding-8x);
  cursor: pointer; white-space: nowrap;
  font-family: var(--font-family-primary);
  font-size: var(--font-size-body-small);
  color: var(--color-neutral-1000);
  border: none; background: transparent; width: 100%; text-align: left;
  transition: background-color .15s;
}
.frota-dropdown-menu__item:hover { background: var(--color-neutral-200); }
.frota-dropdown-menu__item--danger { color: var(--color-error-600); }

/* =========================================================================
   SCREEN SCAFFOLDS (layout-only, not DS components)
   ========================================================================= */
.scr { display: flex; flex-direction: column; gap: var(--gap-10x); max-width: 1400px; margin: 0 auto; }
.scr__head {
  display: flex; justify-content: space-between; align-items: flex-end;
  gap: var(--gap-8x);
}
.scr__title {
  margin: 0; font-family: var(--font-family-primary);
  font-size: var(--font-size-h1); line-height: var(--line-height-h1);
  font-weight: var(--font-weight-bold);
  color: var(--color-neutral-1000);
  letter-spacing: -0.01em;
}
.scr__subtitle {
  margin: var(--padding-2x) 0 0;
  font-size: var(--font-size-body-small);
  color: var(--color-neutral-700);
}
.scr__actions { display: flex; gap: var(--gap-6x); }
.crumb { font-size: var(--font-size-body-xsmall); color: var(--color-neutral-600); margin-bottom: var(--gap-2x); }

.scr__stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap-8x); }

.scr__grid { display: grid; grid-template-columns: 2fr 1fr; gap: var(--gap-8x); }

.panel-title {
  margin: 0 0 var(--padding-8x);
  font-family: var(--font-family-primary);
  font-size: var(--font-size-h5);
  font-weight: var(--font-weight-bold);
  color: var(--color-neutral-1000);
}
.panel-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: var(--padding-12x);
  padding-bottom: 0;
}
.panel-head h3 {
  margin: 0;
  font-family: var(--font-family-primary);
  font-size: var(--font-size-h5);
  font-weight: var(--font-weight-bold);
  color: var(--color-neutral-1000);
}
.panel-body { padding: var(--padding-12x); }
.panel-body--tight { padding: var(--padding-8x) var(--padding-12x); }
.panel-link {
  color: var(--color-primary-500);
  font-size: var(--font-size-body-xsmall);
  font-weight: var(--font-weight-bold);
  text-decoration: none;
}

.alert-list { display: flex; flex-direction: column; gap: var(--gap-4x); padding: var(--padding-8x) var(--padding-12x) var(--padding-12x); }
.alert-row {
  display: flex; gap: var(--gap-6x);
  padding: var(--padding-6x) var(--padding-8x);
  border-radius: var(--border-radius-sm);
  background: var(--color-neutral-200);
  align-items: flex-start;
}
.alert-row__dot {
  width: 8px; height: 8px; border-radius: 50%;
  margin-top: 6px; flex-shrink: 0;
}
.alert-row--error   .alert-row__dot { background: var(--color-error-600); }
.alert-row--warning .alert-row__dot { background: var(--color-warning-600); }
.alert-row--info    .alert-row__dot { background: var(--color-information-600); }
.alert-row__title {
  font-size: var(--font-size-body-small);
  font-weight: var(--font-weight-medium);

<script type="text/babel" data-presets="react">
// === Primitives.jsx ===
// Primitives.jsx — Frota 162 Portal UI kit
// Cada componente espelha o SCSS correspondente em frota-ds/src/components/.

function Button({ variant = 'primary', size = 'medium', children, startIcon, endIcon, onClick, disabled, fullWidth, type = 'button' }) {
  return (
    <button
      type={type}
      className={`frota-button frota-button--${variant} frota-button--${size} ${fullWidth ? 'frota-button--full' : ''}`}
      onClick={onClick}
      disabled={disabled}
    >
      {startIcon && <span className="frota-button__icon">{startIcon}</span>}
      <span>{children}</span>
      {endIcon && <span className="frota-button__icon">{endIcon}</span>}
    </button>
  );
}

// IconButton — atoms/iconButton
// variant: 'rounded' | 'outlined' | 'ghost'    size: 'small' | 'medium'
function IconButton({ variant = 'ghost', size = 'medium', color = 'neutral', onClick, children, disabled, ariaLabel }) {
  return (
    <button
      type="button"
      aria-label={ariaLabel}
      onClick={onClick}
      disabled={disabled}
      className={`frota-icon-button frota-icon-button--${variant} frota-icon-button--${size} frota-icon-button--${color}`}
    >
      <span className="frota-icon-button__icon">{children}</span>
    </button>
  );
}

// Avatar — atoms/avatar
// variant: 'initials' | 'fallback'   size: 'small' | 'medium' | 'large'
function Avatar({ initials, size = 'medium', variant = 'initials' }) {
  return (
    <span className={`frota-avatar frota-avatar--${size} frota-avatar--${variant}`}>
      {initials}
    </span>
  );
}

// Badge wrapper — atoms/badge (wrapper exposes its `__indicator` at `position`)
function Badge({ children, count, color = 'primary', dot = false, position = 'top-right', invisible = false, max = 99 }) {
  const showIndicator = !invisible && (dot || (count !== undefined && count !== null));
  const display = count > max ? `${max}+` : count;
  return (
    <span className="frota-badge">
      {children}
      {showIndicator && (
        <span className={`frota-badge__indicator frota-badge__indicator--${color} frota-badge__indicator--${position} ${dot ? 'frota-badge__indicator--dot' : ''}`}>
          {!dot && display}
        </span>
      )}
    </span>
  );
}

// Tag — atoms/tag — UPPERCASE pill, for status labels/categories
// color: primary | secondary | neutral | info | success | warning | error
// accent: 'on' (filled) | 'off' (soft)
function Tag({ children, color = 'neutral', accent = 'off' }) {
  return (
    <span className={`frota-tag frota-tag--${color} frota-tag--accent-${accent}`}>
      <span className="frota-tag__label">{children}</span>
    </span>
  );
}

// Chip — atoms/chip — rounded-sm, border, for filters/interactive selects
// color: neutral | primary | primary-dark | red | red-dark | yellow | blue | green
function Chip({ children, color = 'neutral', selected = false, clickable = false, onClick, icon, disabled }) {
  const cls = [
    'frota-chip',
    `frota-chip--${color}`,
    selected && 'frota-chip--selected',
    clickable && 'frota-chip--clickable',
    disabled && 'frota-chip--disabled',
  ].filter(Boolean).join(' ');
  return (
    <span className={cls} onClick={clickable && !disabled ? onClick : undefined} role={clickable ? 'button' : undefined}>
      {icon && <span className="frota-chip__icon">{icon}</span>}
      <span className="frota-chip__label">{children}</span>
    </span>
  );
}

// Input — molecules/input
function Input({ value, defaultValue, onChange, placeholder, startIcon, endIcon, label, type = 'text', readOnly }) {
  return (
    <div className="frota-input-wrapper">
      {label && <label className="frota-input__label">{label}</label>}
      <div className="frota-input__control-container">
        {startIcon && <span className="frota-input__icon frota-input__icon--start">{startIcon}</span>}
        <input
          type={type}
          className="frota-input"
          value={value}
          defaultValue={defaultValue}
          onChange={onChange}
          placeholder={placeholder}
          readOnly={readOnly}
        />
        {endIcon && <span className="frota-input__icon frota-input__icon--end">{endIcon}</span>}
      </div>
    </div>
  );
}

// Tabs — atoms/tabs (underline style, NOT pill)
function Tabs({ items, activeId, onSelect }) {
  return (
    <div className="frota-tabs" role="tablist">
      {items.map(item => (
        <button
          key={item.id}
          role="tab"
          aria-selected={item.id === activeId}
          onClick={() => onSelect?.(item.id)}
          className={`frota-tabs__tab ${item.id === activeId ? 'frota-tabs__tab--active' : ''}`}
        >
          <span className="frota-tabs__tab-label">{item.label}</span>
        </button>
      ))}
    </div>
  );
}

// KPI card — molecules/card with `__kpi` variant
function KpiCard({ label, value, subtitle, subtitleDir, icon }) {
  return (
    <div className="frota-card">
      <div className="frota-card__kpi">
        <div className="frota-card__kpi-top">
          {icon && <span className="frota-card__kpi-icon">{icon}</span>}
          <span className="frota-card__kpi-label">{label}</span>
        </div>
        <div className="frota-card__kpi-value">{value}</div>
        {subtitle && (
          <div className={`frota-card__kpi-subtitle ${subtitleDir || ''}`}>
            {subtitle}
          </div>
        )}
      </div>
    </div>
  );
}

// Generic Card wrapper
function Card({ title, description, children, footer }) {
  return (
    <div className="frota-card">
      {(title || description) && (
        <div className="frota-card__header">
          {title && <h3 className="frota-card__title">{title}</h3>}
          {description && <p className="frota-card__description">{description}</p>}
        </div>
      )}
      {children && <div className="frota-card__content">{children}</div>}
      {footer && <div className="frota-card__footer">{footer}</div>}
    </div>
  );
}

// ---------- Helpers ----------
function initialsOf(name) {
  return name.split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();
}

// Status → chip color map (DS)
const STATUS_CHIP = {
  'Em rota':      'green',
  'Abastecendo':  'blue',
  'Parado':       'neutral',
  'Manutenção':   'yellow',
  'Alerta':       'red',
};
function StatusChip({ status, selected = true }) {
  const color = STATUS_CHIP[status] || 'neutral';
  return <Chip color={color} selected={selected}>{status}</Chip>;
}

Object.assign(window, {
  Button, IconButton, Avatar, Badge, Tag, Chip, Input, Tabs,
  KpiCard, Card, StatusChip, initialsOf,
});
</script>

// ─── Campo select (portal dropdown — mesma interação do tipo de data) ────────
function AfdSelect({ label, options, value, onChange, disabled, tooltipText }) {
  const [open,    setOpen]    = useAfdState(false);
  const [dropPos, setDropPos] = useAfdState({});
  const wrapRef  = useAfdRef(null);
  const dropRef  = useAfdRef(null);

  // Normalise options to { value, label }
  var opts = (options || []).map(function(o) {
    return typeof o === 'string' ? { value: o, label: o } : o;
  });

  var selectedLabel = (opts.find(function(o) { return o.value === value; }) || {}).label || null;

  function openDrop() {
    if (disabled || !wrapRef.current) return;
    var r = wrapRef.current.getBoundingClientRect();
    var spaceBelow = window.innerHeight - r.bottom;
    var dropH = Math.min(opts.length * 38 + 8, 300);
    var top = spaceBelow >= dropH + 8 ? r.bottom + 4 : r.top - dropH - 4;
    setDropPos({ top: top, left: r.left, width: r.width });
    setOpen(true);
  }

  useAfdEffect(function() {
    if (!open) return;
    function h(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target) &&
          dropRef.current  && !dropRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener('mousedown', h);
    return function() { document.removeEventListener('mousedown', h); };
  }, [open]);

  return (
    <div ref={wrapRef} style={{ display: 'flex', flexDirection: 'column' }}>
      <FieldLabel label={label} disabled={disabled} tooltipText={tooltipText} />
      <div
        onClick={disabled ? undefined : (open ? function() { setOpen(false); } : openDrop)}
        style={{
          position: 'relative', display: 'flex', alignItems: 'center',
          height: 36, padding: '0 28px 0 10px', boxSizing: 'border-box',
          border: '1px solid ' + (open ? 'var(--color-primary-500)' : (disabled ? '#eceded' : 'var(--color-neutral-400)')),

function AfdTreeSelect({ label, value, onChange, disabled, tooltipText }) {

  function openDropdown() {
    if (disabled) return;
    if (wrapRef.current) {
      var r = wrapRef.current.getBoundingClientRect();
      setDropRect({ top: r.bottom + 4, left: r.left, width: Math.max(r.width, 260) });
    }
    setOpen(true);
  }

  function handleFocus() {
    setFocused(true);
    setIsTyping(false);
    setQuery('');
    openDropdown();
  }

    setIsTyping(true);
    setQuery(e.target.value);
    openDropdown();
  }

  function handleSelect(node) {
    onChange(node.label);
    setIsTyping(false);
    setQuery('');
    setOpen(false);
    if (inputRef.current) inputRef.current.blur();
  }

  function handleClear(e) {
    e.preventDefault();
    onChange('');
    setIsTyping(false);
    setQuery('');
    setOpen(false);
  }

    if (!open) return;

        setOpen(false); setIsTyping(false); setQuery(''); setFocused(false);
      }
    }
    document.addEventListener('mousedown', h);

// ─── Multi-select com autocomplete (AIT) — campo IS o input, sem busca interna ─
function AfdMultiSelect({ label, value, onChange, disabled, tooltipText }) {
  const [query,    setQuery]    = useAfdState('');
  const [isTyping, setIsTyping] = useAfdState(false);
  const [open,     setOpen]     = useAfdState(false);
  const [focused,  setFocused]  = useAfdState(false);
  const [dropRect, setDropRect] = useAfdState(null);
  const wrapRef  = useAfdRef(null);
  const inputRef = useAfdRef(null);

  var selected = Array.isArray(value) ? value : [];

  function getOptions() { return window.MOCK_AIT_OPTIONS || []; }

  var filtered = isTyping && query.trim()
    ? getOptions().filter(function(o) { return o.toLowerCase().indexOf(query.toLowerCase()) >= 0; })
    : getOptions();

  // Quando não está digitando, mostra os selecionados no input; digitando, mostra o query
  var displayValue = isTyping
    ? query
    : selected.length > 0
      ? selected.slice(0, 2).join(', ') + (selected.length > 2 ? ' +' + (selected.length - 2) : '')
      : '';

  function openDropdown() {
    if (disabled || !wrapRef.current) return;
    var r = wrapRef.current.getBoundingClientRect();
    setDropRect({ top: r.bottom + 4, left: r.left, width: Math.max(r.width, 260) });
    setOpen(true);
  }

  function handleFocus() {
    setFocused(true);
    setIsTyping(false);
    setQuery('');
    openDropdown();
  }

  function handleChange(e) {
    setIsTyping(true);
    setQuery(e.target.value);
    openDropdown();
  }

  function toggleItem(opt) {
    var next = selected.includes(opt)
      ? selected.filter(function(s) { return s !== opt; })
      : selected.concat(opt);
    onChange(next);
    setIsTyping(false);
    setQuery('');
    // mantém o dropdown aberto para seleção múltipla
    if (inputRef.current) inputRef.current.focus();
  }

  function handleClear(e) {
    e.preventDefault();
    onChange([]);
    setIsTyping(false);
    setQuery('');
    setOpen(false);
  }

  useAfdEffect(function() {
    if (!open) return;
    function h(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) {
        setOpen(false); setIsTyping(false); setQuery(''); setFocused(false);
      }
    }
    document.addEventListener('mousedown', h);
    return function() { document.removeEventListener('mousedown', h); };
  }, [open]);

  var isFocusedOrOpen = focused || open;

  return (
    <div ref={wrapRef} style={{ display: 'flex', flexDirection: 'column' }}>
      <FieldLabel label={label} disabled={disabled} tooltipText={tooltipText} />
      <div style={{
        position: 'relative', display: 'flex', alignItems: 'center',
        height: 36, boxSizing: 'border-box',
        border: '1px solid ' + (isFocusedOrOpen ? 'var(--color-primary-500)' : (disabled ? '#eceded' : 'var(--color-neutral-400)')),
        borderRadius: 6, background: disabled ? '#f5f5f5' : '#fff',
        boxShadow: isFocusedOrOpen ? '0 0 0 2px var(--color-primary-200)' : 'none',
        opacity: disabled ? 0.5 : 1,
        transition: 'border-color .15s, box-shadow .15s',
      }}>
        <input
          ref={inputRef}
          value={displayValue}
          placeholder="Busque e selecione"
          disabled={disabled}
          onFocus={handleFocus}
          onBlur={function() { setFocused(false); }}
          onChange={handleChange}
          className="inf-placeholder-input"
          style={{
            flex: 1, border: 'none', outline: 'none', background: 'transparent',
            fontFamily: 'var(--font-family-primary)', fontSize: 13,
            color: selected.length > 0 && !isTyping ? 'var(--color-neutral-1000)' : 'var(--color-neutral-900)',
            padding: '0 28px 0 10px',
            height: '100%', width: '100%', cursor: disabled ? 'default' : 'text',
          }}
        />
        {selected.length > 0 && !disabled ? (
          <span onMouseDown={handleClear} style={{ position: 'absolute', right: 8, top: '50%', transform: 'translateY(-50%)', color: 'var(--color-neutral-500)', display: 'inline-flex', cursor: 'pointer' }}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </span>
        ) : (
          <span style={{ position: 'absolute', right: 8, top: '50%', transform: 'translateY(-50%) ' + (open ? 'rotate(180deg)' : ''), pointerEvents: 'none', display: 'flex', color: disabled ? '#c4c4c5' : 'var(--color-neutral-600)', transition: 'transform .2s' }}>
            <AfdIconChevron />
          </span>
        )}
      </div>

      {open && !disabled && dropRect && ReactDOM.createPortal(
        <div style={{
          position: 'fixed', top: dropRect.top, left: dropRect.left, width: dropRect.width,
          zIndex: 9999, background: '#fff',
          border: '1px solid var(--color-neutral-300)', borderRadius: 8,
          boxShadow: '0 8px 24px rgba(0,0,0,0.12)',
          padding: '4px 0', maxHeight: 280, overflowY: 'auto',
          fontFamily: 'var(--font-family-primary)',
        }}>
          {filtered.length === 0 && (
            <div style={{ padding: '12px 14px', fontSize: 13, color: 'var(--color-neutral-500)' }}>Nenhum resultado</div>
          )}
          {filtered.map(function(opt) {
            var isSel = selected.includes(opt);
            return (
              <div key={opt}
                onMouseDown={function(e) { e.preventDefault(); toggleItem(opt); }}
                style={{
                  display: 'flex', alignItems: 'center', gap: 8,
                  padding: '9px 14px', cursor: 'pointer',
                  background: isSel ? 'var(--color-primary-100)' : 'transparent',
                  color: isSel ? 'var(--color-primary-600)' : 'var(--color-neutral-1000)',
                  fontWeight: isSel ? 600 : 400, fontSize: 13,
                  transition: 'background .1s',
                }}
                onMouseEnter={function(e) { if (!isSel) e.currentTarget.style.background = 'var(--color-neutral-100)'; }}
                onMouseLeave={function(e) { e.currentTarget.style.background = isSel ? 'var(--color-primary-100)' : 'transparent'; }}
              >
                <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{opt}</span>
                {isSel && <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary-500)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}><polyline points="20 6 9 17 4 12"/></svg>}
              </div>
            );
          })}
        </div>,
        document.body
      )}
    </div>
  );
}
