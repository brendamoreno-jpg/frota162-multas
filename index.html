  const calDropRef  = useAfdRef(null);

  var allOpts = window.DATE_TYPE_OPTIONS || [];
  var availableOpts = allOpts.filter(function(o) { return o.tabs.indexOf(activeTab) >= 0; });
  var selectedLabel = (availableOpts.find(function(o) { return o.id === dateType; }) || {}).label || null;

  var MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var DAYS   = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  function fmtDate(d) {
    if (!d) return '';
    return [String(d.getDate()).padStart(2,'0'), String(d.getMonth()+1).padStart(2,'0'), d.getFullYear()].join('/');
  }
  function isSameDay(a, b) { return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

  var displayRange = startDate && endDate ? fmtDate(startDate)+' – '+fmtDate(endDate)
    : startDate ? fmtDate(startDate)+' – ...' : '';

  function openTypeDrop() {
    if (disabled || !typeRef.current) return;
    var r = typeRef.current.getBoundingClientRect();
    setTypeDropPos({ top: r.bottom + 4, left: r.left, width: Math.max(r.width, 300) });
    setTypeOpen(true);
  }
  function openCal() {
    if (disabled || !calRef.current) return;
    var r = calRef.current.getBoundingClientRect();
    var top = (window.innerHeight - r.bottom) >= 340 ? r.bottom + 4 : r.top - 344;
    setCalDropPos({ top: top, left: r.left });
    setCalOpen(true);
    setPhase(startDate ? 'end' : 'start');
  }

  useAfdEffect(function() {
    if (!typeOpen) return;
    function h(e) {
      if (typeRef.current && !typeRef.current.contains(e.target) &&
          typeDropRef.current && !typeDropRef.current.contains(e.target)) setTypeOpen(false);
    }
    document.addEventListener('mousedown', h);
    return function() { document.removeEventListener('mousedown', h); };
  }, [typeOpen]);

  useAfdEffect(function() {
    if (!calOpen) return;
    function h(e) {
      if (calRef.current && !calRef.current.contains(e.target) &&
          calDropRef.current && !calDropRef.current.contains(e.target)) { setCalOpen(false); setHoverDate(null); }
    }
    document.addEventListener('mousedown', h);
    return function() { document.removeEventListener('mousedown', h); };
  }, [calOpen]);

  function handleDayClick(date) {
    if (phase === 'start') {
      onChange({ dateType: dateType, startDate: date, endDate: null });
      setPhase('end');
    } else {
      var s = startDate, e = date;
      if (date < startDate) { s = date; e = startDate; }
      onChange({ dateType: dateType, startDate: s, endDate: e });
      setPhase('start'); setCalOpen(false); setHoverDate(null);
    }
  }

  var yr = viewMonth.year, mo = viewMonth.month;
  var firstDow = new Date(yr, mo, 1).getDay();
  var daysInMo = new Date(yr, mo + 1, 0).getDate();
  var cells = [];
  for (var i = 0; i < firstDow; i++) cells.push(null);
  for (var d = 1; d <= daysInMo; d++) cells.push(new Date(yr, mo, d));
  var todayStr = new Date().toDateString();

  var BSTY = { background: 'none', border: 'none', cursor: 'pointer', borderRadius: 4, fontFamily: 'var(--font-family-primary)', fontSize: 13, color: 'var(--color-neutral-600)' };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
      <FieldLabel label="Data" disabled={disabled} tooltipText={tooltipText} />
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {/* Type select */}
        <div ref={typeRef} style={{ position: 'relative' }}>
          <div onClick={typeOpen ? function() { setTypeOpen(false); } : openTypeDrop}
            className={disabled ? 'afd-disabled' : ''}
            style={{
              position: 'relative', display: 'flex', alignItems: 'center',
              height: 36, padding: '0 28px 0 10px', boxSizing: 'border-box',
              border: '1px solid '+(typeOpen ? 'var(--color-primary-500)' : (disabled ? '#eceded' : 'var(--color-neutral-400)')),
              borderRadius: 6, background: disabled ? '#f5f5f5' : '#fff',
              cursor: disabled ? 'default' : 'pointer',
              fontFamily: 'var(--font-family-primary)', fontSize: 13,
              color: disabled ? '#c4c4c5' : (selectedLabel ? 'var(--color-neutral-1000)' : 'var(--color-neutral-700)'),
              overflow: 'hidden', whiteSpace: 'nowrap', opacity: disabled ? 0.5 : 1,
              boxShadow: typeOpen ? '0 0 0 2px var(--color-primary-200)' : 'none',
              transition: 'border-color .15s',
            }}>
            <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis' }}>{selectedLabel || 'Tipo de data'}</span>
            {selectedLabel && !disabled ? (
              <span onMouseDown={function(e) { e.stopPropagation(); onChange({ dateType: null, startDate: startDate, endDate: endDate }); }}
                style={{ position: 'absolute', right: 8, top: '50%', transform: 'translateY(-50%)', cursor: 'pointer', color: 'var(--color-neutral-500)', display: 'flex' }}>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </span>
            ) : (
              <span style={{ position: 'absolute', right: 8, top: '50%', transform: 'translateY(-50%) '+(typeOpen ? 'rotate(180deg)' : ''), pointerEvents: 'none', display: 'flex', color: disabled ? '#c4c4c5' : 'var(--color-neutral-600)', transition: 'transform .2s' }}>
                <AfdIconChevron />
              </span>
            )}
          </div>
          {typeOpen && !disabled && ReactDOM.createPortal(
            <div ref={typeDropRef} style={{
              position: 'fixed', top: typeDropPos.top, left: typeDropPos.left, width: typeDropPos.width,
              zIndex: 9999, background: '#fff', border: '1px solid var(--color-neutral-300)',
              borderRadius: 8, boxShadow: '0 8px 24px rgba(0,0,0,0.12)',
              padding: '4px 0', maxHeight: 300, overflowY: 'auto',
              fontFamily: 'var(--font-family-primary)',
            }}>
              {availableOpts.map(function(opt) {
                var isSel = dateType === opt.id;
                return (
                  <div key={opt.id}
                    onClick={function() { onChange({ dateType: opt.id, startDate: startDate, endDate: endDate }); setTypeOpen(false); }}
                    style={{
                      padding: '9px 14px', cursor: 'pointer', fontSize: 13,
                      background: isSel ? 'var(--color-primary-100)' : 'transparent',
                      color: isSel ? 'var(--color-primary-600)' : 'var(--color-neutral-1000)',
                      fontWeight: isSel ? 600 : 400,
                      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                      transition: 'background .1s',
                    }}
                    onMouseEnter={function(e) { if (!isSel) e.currentTarget.style.background = 'var(--color-neutral-100)'; }}
                    onMouseLeave={function(e) { if (!isSel) e.currentTarget.style.background = 'transparent'; }}
                  >
                    {opt.label}
                    {isSel && (
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary-500)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    )}
                  </div>
                );
              })}
            </div>,
            document.body
          )}
        </div>
        {/* Date range */}
        <div ref={calRef} style={{ position: 'relative' }}>
          <div onClick={calOpen ? function() { setCalOpen(false); } : openCal}
            className={disabled ? 'afd-disabled' : ''}
            style={{
              position: 'relative', display: 'flex', alignItems: 'center',
              height: 36, padding: '0 28px 0 10px', boxSizing: 'border-box',
              border: '1px solid '+(calOpen ? 'var(--color-primary-500)' : (disabled ? '#eceded' : 'var(--color-neutral-400)')),
              borderRadius: 6, background: disabled ? '#f5f5f5' : '#fff',
              cursor: disabled ? 'default' : 'pointer',
              fontFamily: 'var(--font-family-primary)', fontSize: 13,
              color: disabled ? '#c4c4c5' : (displayRange ? 'var(--color-neutral-1000)' : 'var(--color-neutral-700)'),
              overflow: 'hidden', whiteSpace: 'nowrap', opacity: disabled ? 0.5 : 1,
              boxShadow: calOpen ? '0 0 0 2px var(--color-primary-200)' : 'none',
              transition: 'border-color .15s',
            }}>
            <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis' }}>{displayRange || 'DD/MM/AAAA – DD/MM/AAAA'}</span>
            {(startDate || endDate) && !disabled ? (
              <span onMouseDown={function(e) { e.stopPropagation(); onChange({ dateType: dateType, startDate: null, endDate: null }); setPhase('start'); }}
                style={{ position: 'absolute', right: 8, top: '50%', transform: 'translateY(-50%)', cursor: 'pointer', color: 'var(--color-neutral-500)', display: 'flex' }}>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </span>
            ) : (
              <span style={{ position: 'absolute', right: 8, top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none', display: 'flex', color: disabled ? '#c4c4c5' : 'var(--color-neutral-600)' }}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
              </span>
            )}
          </div>
          {calOpen && !disabled && ReactDOM.createPortal(
            <div ref={calDropRef} style={{
              position: 'fixed', top: calDropPos.top, left: calDropPos.left,
              width: 280, zIndex: 9999, background: '#fff',
              border: '1px solid var(--color-neutral-200)', borderRadius: 12,
              boxShadow: '0 8px 32px rgba(0,0,0,0.14)',
              fontFamily: 'var(--font-family-primary)',
            }}>
              {/* Header */}
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 16px 10px' }}>
                <button onClick={function() { var d = new Date(yr, mo-1,1); setViewMonth({year:d.getFullYear(),month:d.getMonth()}); }}
                  style={{ ...BSTY, padding: '4px 8px', fontSize: 16, display: 'flex' }}
                  onMouseEnter={function(e){e.currentTarget.style.background='var(--color-neutral-200)';}}
                  onMouseLeave={function(e){e.currentTarget.style.background='none';}}>‹</button>
                <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--color-neutral-900)' }}>{MONTHS[mo]} {yr}</span>
                <button onClick={function() { var d = new Date(yr, mo+1,1); setViewMonth({year:d.getFullYear(),month:d.getMonth()}); }}
                  style={{ ...BSTY, padding: '4px 8px', fontSize: 16, display: 'flex' }}
                  onMouseEnter={function(e){e.currentTarget.style.background='var(--color-neutral-200)';}}
                  onMouseLeave={function(e){e.currentTarget.style.background='none';}}>›</button>
              </div>
              <div style={{ textAlign: 'center', fontSize: 11, color: 'var(--color-neutral-500)', marginBottom: 6, fontWeight: 500 }}>
                {phase === 'start' ? 'Selecione a data inicial' : 'Selecione a data final'}
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', padding: '0 12px' }}>
                {DAYS.map(function(d) { return (<div key={d} style={{ textAlign:'center',fontSize:11,fontWeight:600,color:'var(--color-neutral-500)',padding:'4px 0' }}>{d}</div>); })}
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 2, padding: '4px 12px 8px' }}>
                {cells.map(function(date, i) {
                  if (!date) return React.createElement('div', {key:'e'+i});
                  var isStart = isSameDay(date, startDate);
                  var isEnd   = isSameDay(date, endDate);
                  var isToday = date.toDateString() === todayStr;
                  var rangeEnd = phase === 'end' && hoverDate ? hoverDate : endDate;
                  var inRange = false;
                  if (startDate && rangeEnd) {
                    var lo = startDate < rangeEnd ? startDate : rangeEnd;
                    var hi = startDate < rangeEnd ? rangeEnd : startDate;
                    inRange = date > lo && date < hi;
                  }
                  var isSel = isStart || isEnd;
                  return (
                    <div key={date.toISOString()}
                      onClick={function() { handleDayClick(date); }}
                      onMouseEnter={function() { if (phase==='end') setHoverDate(date); }}
                      onMouseLeave={function() { if (phase==='end') setHoverDate(null); }}
                      style={{
                        display:'flex', alignItems:'center', justifyContent:'center',
                        height:34, borderRadius:6, cursor:'pointer', fontSize:13, userSelect:'none',
                        background: isSel ? 'var(--color-primary-500)' : inRange ? 'var(--color-primary-100)' : 'transparent',
                        color: isSel ? '#fff' : isToday ? 'var(--color-primary-600)' : 'var(--color-neutral-900)',
                        fontWeight: isSel ? 700 : isToday ? 600 : 400,
                        transition: 'background .1s',
                      }}
                      onMouseOver={function(e) { if (!isSel && !inRange) e.currentTarget.style.background = 'var(--color-neutral-200)'; }}
                      onMouseOut={function(e) {
                        if (!isSel && !inRange) e.currentTarget.style.background = 'transparent';
                        else if (inRange) e.currentTarget.style.background = 'var(--color-primary-100)';
                      }}
                    >{date.getDate()}</div>
                  );
                })}
              </div>
              <div style={{ padding: '8px 16px 12px', borderTop: '1px solid var(--color-neutral-200)' }}>
                <button onClick={function() { onChange({ dateType: dateType, startDate: null, endDate: null }); setPhase('start'); }}
                  style={{ ...BSTY, padding: '4px 8px' }}
                  onMouseEnter={function(e){e.currentTarget.style.color='var(--color-primary-500)';}}
                  onMouseLeave={function(e){e.currentTarget.style.color='var(--color-neutral-600)';}}>Limpar datas</button>
              </div>
            </div>,
            document.body
          )}
        </div>
      </div>
    </div>
  );
}

// ─── Header de grupo ──────────────────────────────────────────────────────────
function GroupHeader({ label, first }) {
  return (
    <div style={{
      fontSize: 11, fontWeight: 500,
      fontFamily: 'var(--font-family-primary)',
      textTransform: 'uppercase',
      letterSpacing: '0.5px',
      color: 'var(--color-neutral-500)',
      paddingBottom: 8,
      borderBottom: '0.5px solid var(--color-neutral-200)',
      marginBottom: 12,
      marginTop: first ? 0 : 32,
    }}>{label}</div>
  );
}

// ─── Estado inicial ───────────────────────────────────────────────────────────
const AFD_INITIAL = {
  empresa: '', centroCusto: '',
  ait: [], placa: '',
  orgaoAutuador: '', codigoCtb: '', recorrivel: '', uf: '',
  dateFilter: { dateType: null, startDate: null, endDate: null },
  condutorVinculado: '', condutorIndicadoFormal: '',
  statusIndicacao: '', tipoIndicacao: '',
  infracaoTratada: '', ativos: '', infracaoCancelada: '', descontoCond: '',
  possuiBoleto: '', incluirPagas: '', possuiAnexo: '',
};

// ─── Regras de disabled por tab ───────────────────────────────────────────────
const DISABLED_BY_TAB = {
  indicacao: new Set(['incluirPagas', 'condutorIndicadoFormal']),
  pagamento: new Set(['tipoIndicacao']),
  todas:     new Set(),
};

// ─── Componente principal ─────────────────────────────────────────────────────
function AdvancedFiltersDrawer({ open, activeTab = 'todas', onClose, onApply, onClear }) {
  const [filters, setFilters] = useAfdState(AFD_INITIAL);

  useAfdEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [open, onClose]);

  function set(key, val) { setFilters(prev => ({ ...prev, [key]: val })); }

  function handleClear() {
    setFilters(AFD_INITIAL);
    onClear?.();
  }

  function handleApply() {
    onApply?.(filters);
    onClose();
  }

  const disabledKeys = DISABLED_BY_TAB[activeTab] || new Set();

  const tooltipText = activeTab === 'indicacao'
    ? 'Este filtro não se aplica à aba Indicação de condutor'
    : activeTab === 'pagamento'
    ? 'Este filtro não se aplica à aba Pagamento'
    : '';

  function dis(key) { return disabledKeys.has(key); }
  function tip(key) { return dis(key) ? tooltipText : ''; }

  if (!open) return null;

  return (
    <>
      {/* Overlay */}
      <div
        className="afd-overlay"
        onClick={onClose}
        style={{
          position: 'fixed', inset: 0, zIndex: 800,
          background: 'rgba(0,0,0,0.35)',
        }}
      />

      {/* Painel */}
      <div
        className="afd-panel"
        style={{
          position: 'fixed', top: 0, right: 0,
          width: 480, height: '100vh', zIndex: 900,
          background: '#fff',
          borderLeft: '1px solid var(--color-neutral-300)',
          boxShadow: '-8px 0 32px rgba(0,0,0,0.12)',
          display: 'flex', flexDirection: 'column',
          fontFamily: 'var(--font-family-primary)',
        }}
      >
        {/* ── Header ── */}
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '16px 20px',
          borderBottom: '1px solid var(--color-neutral-200)',
          flexShrink: 0,
        }}>
          <div>
            <div style={{ fontSize: 16, fontWeight: 700, color: 'var(--color-neutral-900)', lineHeight: 1.3 }}>
              Filtros avançados
            </div>
          </div>
          <button
            onClick={onClose}
            style={{
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              width: 32, height: 32, border: 'none', background: 'transparent',
              color: 'var(--color-neutral-600)', cursor: 'pointer', borderRadius: 6,
              transition: 'background .15s, color .15s', flexShrink: 0,
            }}
            onMouseEnter={e => { e.currentTarget.style.background = 'var(--color-neutral-200)'; e.currentTarget.style.color = 'var(--color-neutral-900)'; }}
            onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = 'var(--color-neutral-600)'; }}
          >
            <AfdIconX />
          </button>
        </div>

        {/* ── Corpo scrollável ── */}
        <div className="afd-scrollbar" style={{
          flex: 1, overflowY: 'auto',
          padding: '20px 20px 8px',
        }}>

          {/* ── ORGANIZAÇÃO ── */}
          <GroupHeader label="Organização" first />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            <AfdTreeSelect label="Empresa" value={filters.empresa} onChange={v => set('empresa', v)}
              disabled={dis('empresa')} tooltipText={tip('empresa')} />
            <AfdSelect label="Centro de custo" value={filters.centroCusto} onChange={v => set('centroCusto', v)}
              options={['Todos', 'CC-001 Operações', 'CC-002 Logística', 'CC-003 Distribuição', 'CC-004 Administrativo']}
              disabled={dis('centroCusto')} tooltipText={tip('centroCusto')} />
          </div>

          {/* ── MULTA ── */}
          <GroupHeader label="Multa" />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            <AfdMultiSelect label="AIT" value={filters.ait} onChange={v => set('ait', v)}
              disabled={dis('ait')} tooltipText={tip('ait')} />
            <AfdAutocompleteSelect label="Veículo (placa)" value={filters.placa} onChange={v => set('placa', v)}
              placeholder="Busque pela placa" disabled={dis('placa')} tooltipText={tip('placa')} />
            <AfdDateFilter
              activeTab={activeTab}
              value={filters.dateFilter}
              onChange={v => set('dateFilter', v)}
              disabled={false}
            />
            <AfdSelect label="Órgão autuador" value={filters.orgaoAutuador} onChange={v => set('orgaoAutuador', v)}
              options={['Todos', 'DETRAN-SP', 'DETRAN-MG', 'DETRAN-RJ', 'DETRAN-RS', 'DETRAN-PR', 'CET-SP', 'CET-RJ', 'PRF', 'PMSP', 'DER-SP', 'SINFRA-BA', 'SEMOB-DF']}
              disabled={dis('orgaoAutuador')} tooltipText={tip('orgaoAutuador')} />
            <AfdAutocompleteSelect label="Enquadramento / Código CTB"
              placeholder="Ex: 55680"
              value={filters.codigoCtb} onChange={v => set('codigoCtb', v)}
              options={window.MOCK_CTB_OPTIONS}
              disabled={dis('codigoCtb')} tooltipText={tip('codigoCtb')} />
            <AfdSelect label="Recorrível" value={filters.recorrivel} onChange={v => set('recorrivel', v)}
              options={['Todos', 'Não recorrido', 'A recorrer', 'Recorrido', 'Não elegível']}
              disabled={dis('recorrivel')} tooltipText={tip('recorrivel')} />
            <AfdSelect label="UF / Estado" value={filters.uf} onChange={v => set('uf', v)}
              options={['Todos', 'SP', 'RJ', 'MG', 'RS', 'PR', 'SC', 'BA', 'DF', 'GO', 'PE', 'CE', 'AM', 'PA']}
              disabled={dis('uf')} tooltipText={tip('uf')} />
          </div>

          {/* ── CONDUTOR ── */}
          <GroupHeader label="Condutor" />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            <AfdAutocompleteSelect label="Condutor vinculado" value={filters.condutorVinculado} onChange={v => set('condutorVinculado', v)}
              options={['Rebeca Valetich', 'Wagner Daniel', 'Antônio Pereira', 'Carlos Mendes', 'Ana Paula Souza', 'Fernanda Lima', 'Rogério Alves']}
              placeholder="Busque e selecione" disabled={dis('condutorVinculado')} tooltipText={tip('condutorVinculado')} />
            <AfdAutocompleteSelect label="Condutor indicado" value={filters.condutorIndicadoFormal} onChange={v => set('condutorIndicadoFormal', v)}
              options={['Rebeca Valetich', 'Wagner Daniel', 'Antônio Pereira', 'Carlos Mendes', 'Ana Paula Souza', 'Fernanda Lima']}
              placeholder="Busque e selecione" disabled={dis('condutorIndicadoFormal')} tooltipText={tip('condutorIndicadoFormal')} />
          </div>

          {/* ── INDICAÇÃO ── */}
          <GroupHeader label="Indicação" />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            <AfdSelect label="Status da indicação" value={filters.statusIndicacao} onChange={v => set('statusIndicacao', v)}
              options={[
                'Todos',
                'Indique agora', 'Em processamento', 'Enviada ao órgão',
                'Documentos incorretos', 'Falha na indicação', 'Indeferida pelo órgão',
                'Indique no órgão', 'Indicação vencida', 'Aguardando aceite do condutor',
                'Recusado pelo condutor', 'Vencida sem ação do condutor', 'Condutor indicado', 'Cancelada',
              ]}
              disabled={dis('statusIndicacao')} tooltipText={tip('statusIndicacao')} />
            <AfdSelect label="Tipo de indicação" value={filters.tipoIndicacao} onChange={v => set('tipoIndicacao', v)}
              options={['Todos', 'CPF', 'Formulário']}
              disabled={dis('tipoIndicacao')} tooltipText={tip('tipoIndicacao')} />
          </div>

          {/* ── STATUS E TRATAMENTO ── */}
          <GroupHeader label="Status e tratamento" />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            <AfdSelect label="Multa tratada" value={filters.infracaoTratada} onChange={v => set('infracaoTratada', v)}

function FilterSelect({ label, value, options, onChange }) {

    <div ref={ref} style={{ position: 'relative', minWidth: 140 }}>

        onClick={() => setOpen((v) => !v)}
        style={{

// ─── Tooltip para badges (portal — escapa overflow:hidden) ───────────────────
function TooltipBadge({ children, tooltip }) {
  const [visible, setVisible] = useInfState(false);
  const [pos, setPos] = useInfState({ above: true, x: 0, anchorTop: 0, anchorBottom: 0 });
  const timerRef = useInfRef(null);
  const wrapRef = useInfRef(null);

  function handleEnter() {
    timerRef.current = setTimeout(() => {
      if (wrapRef.current) {
        const r = wrapRef.current.getBoundingClientRect();
        setPos({ above: r.top > 56, x: r.left + r.width / 2, anchorTop: r.top, anchorBottom: r.bottom });
      }
      setVisible(true);
    }, 300);
  }
  function handleLeave() {clearTimeout(timerRef.current);setVisible(false);}
  useInfEffect(() => () => clearTimeout(timerRef.current), []);

  const tooltipEl = visible ? ReactDOM.createPortal(
    <span style={{
      position: 'fixed',
      ...(pos.above ?
      { bottom: `${window.innerHeight - pos.anchorTop + 8}px` } :
      { top: `${pos.anchorBottom + 8}px` }),
      left: `${pos.x}px`,
      transform: 'translateX(-50%)',
      background: 'var(--color-neutral-900)', color: '#fff',
      fontSize: 12, fontWeight: 400, lineHeight: 1.4,
      padding: '6px 10px', borderRadius: 6,
      whiteSpace: 'nowrap', zIndex: 9999,
      pointerEvents: 'none',
      boxShadow: '0 4px 12px rgba(0,0,0,0.22)',
      fontFamily: 'var(--font-family-primary)'
    }}>
      {tooltip}
      <span style={{
        position: 'absolute',
        ...(pos.above ? { bottom: -4, borderTop: '4px solid var(--color-neutral-900)' } : { top: -4, borderBottom: '4px solid var(--color-neutral-900)' }),
        left: '50%', transform: 'translateX(-50%)',
        width: 0, height: 0,
        borderLeft: '4px solid transparent', borderRight: '4px solid transparent'
      }} />
    </span>,
    document.body
  ) : null;

  return (
    <span ref={wrapRef} style={{ display: 'inline-flex' }}
    onMouseEnter={handleEnter} onMouseLeave={handleLeave}>
      {children}
      {tooltipEl}
    </span>);

}

function FilterChip({ label, count, active, onClick, icon, chipColor = 'default' }) {

  return (
    <button
      onClick={onClick}
      style={{
        display: 'inline-flex', alignItems: 'center', gap: 6,
        padding: '6px 10px',
        borderRadius: 8,
        border: active ? `1.5px solid ${theme.border}` : '1px solid var(--color-neutral-300)',
        background: active ? theme.bg : '#fff',
        fontSize: 13, fontWeight: active ? 600 : 400, lineHeight: '18px',
        color: 'var(--color-neutral-900)',
        cursor: 'pointer', whiteSpace: 'nowrap',
        transition: 'all .15s',

        boxShadow: 'none',

      onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = 'var(--color-neutral-100)'; }}

      {icon && <span style={{ display: 'inline-flex', alignItems: 'center', flexShrink: 0 }}>{icon}</span>}

        <span style={{

          minWidth: 18, height: 18,

// ─── Tooltip do ícone de prazo de indicação ───────────────────────────────────
function PrazoInfoTooltip({ prazoOrgaoData }) {
  const [hov, setHov] = useInfState(false);
  const [pos, setPos] = useInfState({ top: 0, left: 0 });
  const ref = useInfRef(null);

  function handleEnter() {
    if (ref.current) {
      const r = ref.current.getBoundingClientRect();
      setPos({ top: r.top - 8, left: r.left + r.width / 2 });
    }
    setHov(true);
  }

  const text = 'Este é o prazo da indicação pela plataforma. O prazo de indicação pelo órgão é até ' + (prazoOrgaoData || 'DD/MM/AAAA');

  return (
    <span ref={ref} onMouseEnter={handleEnter} onMouseLeave={() => setHov(false)}
      style={{ display: 'inline-flex', alignItems: 'center', cursor: 'default', flexShrink: 0 }}>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
        stroke="var(--color-neutral-1000)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      {hov && ReactDOM.createPortal(
        <div style={{
          position: 'fixed',
          top: pos.top,
          left: pos.left,
          transform: 'translate(-50%, -100%)',
          marginTop: -6,
          background: '#1c1c1e',
          color: '#fff',
          fontSize: 12,
          fontWeight: 400,
          fontFamily: 'var(--font-family-primary)',
          lineHeight: 1.5,
          padding: '8px 12px',
          borderRadius: 8,
          maxWidth: 260,
          width: 'max-content',
          zIndex: 9999,
          pointerEvents: 'none',
          boxShadow: '0 4px 16px rgba(0,0,0,0.2)',
          whiteSpace: 'normal',
          textAlign: 'left',
        }}>
          {text}
          <span style={{
            position: 'absolute', bottom: -5, left: '50%', transform: 'translateX(-50%)',
            width: 0, height: 0,
            borderLeft: '5px solid transparent', borderRight: '5px solid transparent',
            borderTop: '5px solid #1c1c1e',
          }} />
        </div>,
        document.body
      )}
    </span>
  );
}

// ─── Prazo indicação ──────────────────────────────────────────────────────────
function Prazo({ dias }) {
  if (dias === null) return <span style={{ color: 'var(--color-neutral-400)', fontSize: 12 }}>—</span>;
  const color = 'var(--color-neutral-1000)';
  const weight = 600;
  return (
    <span style={{ color, fontSize: 12, fontWeight: weight, whiteSpace: 'nowrap' }}>
      ← {dias} {dias === 1 ? 'dia' : 'dias'}
    </span>);

}

// ─── InlineMeta: "LABEL valor ·" em linha ────────────────────────────────────
function InlineMeta({ label, children, first }) {
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, flexShrink: 0, flexWrap: 'nowrap' }}>
      {!first &&
      <span style={{ color: 'var(--color-neutral-300)', fontSize: 12, margin: '0 4px', userSelect: 'none' }}>·</span>

      <span style={{
        fontSize: 10, fontWeight: 700, textTransform: 'uppercase',

      }}>{label}</span>
      {children}
    </span>);

}

// ─── CardMoreMenu — dropdown "Mais ações" ────────────────────────────────────
function CardMoreMenu({ row }) {
  const [open, setOpen] = useInfState(false);
  const [pos, setPos] = useInfState({ top: 0, left: 0 });
  const [subPos, setSubPos] = useInfState(null);
  const [selectedStatus, setSelectedStatus] = useInfState('Não tratada');
  const btnRef = useInfRef(null);
  const statusItemRef = useInfRef(null);
  const hideSubTimerRef = useInfRef(null);

  function toggle(e) {
    e.stopPropagation();
    if (!open && btnRef.current) {
      const r = btnRef.current.getBoundingClientRect();
      setPos({ top: r.bottom + 4, left: r.right });
    }
    setOpen((v) => !v);
    setSubPos(null);
  }

  function showSub() {
    clearTimeout(hideSubTimerRef.current);
    if (statusItemRef.current) {
      const r = statusItemRef.current.getBoundingClientRect();
      setSubPos({ top: r.top, right: window.innerWidth - r.left + 4 });
    }
  }
  function hideSub() { hideSubTimerRef.current = setTimeout(() => setSubPos(null), 120); }
  function keepSub() { clearTimeout(hideSubTimerRef.current); }

  useInfEffect(() => {
    if (!open) return;
    function onOutside(e) {
      if (btnRef.current && !btnRef.current.contains(e.target)) { setOpen(false); setSubPos(null); }
    }
    function onKey(e) { if (e.key === 'Escape') { setOpen(false); setSubPos(null); } }
    document.addEventListener('mousedown', onOutside);
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('mousedown', onOutside); document.removeEventListener('keydown', onKey); };
  }, [open]);

  const ITEMS = [
    { icon: <IconDownload />,  label: 'Baixar boleto' },
    { icon: <IconRefresh />,   label: 'Atualizar boleto 20%' },
    { icon: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 5v14"/><path d="M8 5v14"/><path d="M12 5v14"/><path d="M17 5v14"/><path d="M21 5v14"/></svg>, label: 'Solicitar boleto SNE 40%' },
    { icon: <IconStatus />,    label: 'Status de tratamento', chevron: true, isStatus: true },
    { icon: <IconPrint />,     label: 'Imprimir' },
  ];

  const dropdownStyle = {
    position: 'fixed', zIndex: 9999, background: '#fff',
    border: '1px solid #ddddde', borderRadius: 8, padding: 2,
    boxShadow: '0 4px 16px rgba(0,0,0,0.12)', minWidth: 200,
    animation: 'fadeInOverlay .12s ease', fontFamily: 'var(--font-family-primary)',
  };
  const itemStyle = {
    display: 'flex', alignItems: 'center', gap: 8, padding: '8px 8px',
    borderRadius: 6, border: 'none', background: 'transparent',
    cursor: 'pointer', width: '100%', textAlign: 'left',
    fontSize: 14, fontWeight: 400, color: '#0a0a0a',
    fontFamily: 'var(--font-family-primary)', transition: 'background .1s',
  };

  return (
    <span ref={btnRef} style={{ display: 'inline-flex' }} onClick={(e) => e.stopPropagation()}>
      <button
        title="Mais ações"
        onClick={toggle}
        style={{ width: 28, height: 28, border: 'none',
          background: open ? 'var(--color-neutral-200)' : 'transparent',
          borderRadius: 6, cursor: 'pointer',
          color: open ? 'var(--color-neutral-800)' : 'var(--color-neutral-500)',
          display: 'inline-flex', alignItems: 'center', justifyContent: 'center', transition: 'background .12s' }}
        onMouseEnter={(e) => { if (!open) { e.currentTarget.style.background = 'var(--color-neutral-200)'; e.currentTarget.style.color = 'var(--color-neutral-800)'; }}}
        onMouseLeave={(e) => { if (!open) { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = 'var(--color-neutral-500)'; }}}>
        <IconMoreVert />
      </button>

      {open && ReactDOM.createPortal(
        <div style={{ ...dropdownStyle, top: pos.top, left: pos.left, transform: 'translateX(-100%)' }}
          onClick={(e) => e.stopPropagation()}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 2, padding: '8px 6px' }}>
            {ITEMS.map((item) => (
              <button
                key={item.label}
                ref={item.isStatus ? statusItemRef : null}
                onClick={() => { if (!item.isStatus) setOpen(false); }}
                onMouseEnter={(e) => {
                  e.currentTarget.style.background = item.isStatus ? '#feece8' : 'var(--color-neutral-100)';
                  if (item.isStatus) showSub();
                }}
                onMouseLeave={(e) => {
                  e.currentTarget.style.background = 'transparent';
                  if (item.isStatus) hideSub();
                }}
                style={itemStyle}>
                <span style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: 24, height: 24, flexShrink: 0, color: '#f9401b' }}>
                  {item.icon}
                </span>
                <span style={{ flex: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                  {item.label}
                </span>
                {item.chevron && (
                  <span style={{ color: 'var(--color-neutral-500)', flexShrink: 0 }}><IconChevronRight /></span>
                )}
              </button>
            ))}
          </div>
        </div>,
        document.body
      )}

      {open && subPos && ReactDOM.createPortal(
        <div
          onMouseEnter={keepSub}
          onMouseLeave={hideSub}
          style={{ ...dropdownStyle, top: subPos.top, right: subPos.right, minWidth: 220, animation: 'fadeInOverlay .1s ease' }}
          onClick={(e) => e.stopPropagation()}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 2, padding: '8px 6px' }}>
            {STATUS_TRATAMENTO_OPTIONS.map((opt) => {
              const isActive = selectedStatus === opt;
              return (
                <button
                  key={opt}
                  onClick={() => { setSelectedStatus(opt); setSubPos(null); setOpen(false); }}
                  style={{ ...itemStyle, background: isActive ? '#feece8' : 'transparent', justifyContent: 'space-between' }}
                  onMouseEnter={(e) => { e.currentTarget.style.background = isActive ? '#feece8' : 'var(--color-neutral-100)'; }}
                  onMouseLeave={(e) => { e.currentTarget.style.background = isActive ? '#feece8' : 'transparent'; }}>
                  <span style={{ flex: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', color: '#0a0a0a' }}>{opt}</span>
                  {isActive && (
                    <span style={{ color: '#f9401b', flexShrink: 0, marginLeft: 8 }}>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <polyline points="20 6 9 17 4 12"/>
                      </svg>
                    </span>
                  )}
                </button>
              );
            })}
          </div>
        </div>,
        document.body
      )}
    </span>
  );
}

        padding: 8, width: 32, height: 32, background: '#fff', border: '1px solid #DDDDDE',
        borderRadius: 8, cursor: 'pointer', flexShrink: 0, transition: 'background .12s, border-color .12s' }}
      onMouseEnter={(e) => { e.currentTarget.style.background = 'var(--color-neutral-200)'; e.currentTarget.style.borderColor = 'var(--color-neutral-500)'; }}
      onMouseLeave={(e) => { e.currentTarget.style.background = '#fff'; e.currentTarget.style.borderColor = '#DDDDDE'; }}>
      {children}
    </button>
  );

  // ── Render unificado ──────────────────────────────────────────────────────

  const StatusPill = ({ bg, color, label, tooltip = 'Texto da tooltip', onClick }) => {
    const [hov, setHov] = useInfState(false);
    const [pos, setPos] = useInfState({ top: 0, left: 0 });
    const ref = useInfRef(null);
    const isClickable = !!onClick;
    function handleEnter() {
      if (ref.current) {
        const r = ref.current.getBoundingClientRect();
        setPos({ top: r.top - 8, left: r.left + r.width / 2 });
      }
      setHov(true);
    }
    function handleClick(e) {
      if (!isClickable) return;
      e.stopPropagation();
      onClick();
    }
    return (
      <span ref={ref} onMouseEnter={handleEnter} onMouseLeave={() => setHov(false)}
        onClick={handleClick}
        style={{ display: 'inline-flex', alignItems: 'center', position: 'relative',
          padding: '3px 8px', borderRadius: 1000,
          background: bg, color: color,
          fontSize: 10, fontWeight: 700, letterSpacing: '0.03em',
          textTransform: 'uppercase', whiteSpace: 'nowrap',
          cursor: isClickable ? 'pointer' : 'default',
          outline: isClickable && hov ? `2px solid ${color}` : 'none',
          outlineOffset: 1,
          transition: 'outline .1s, opacity .1s',
          opacity: isClickable && hov ? 0.85 : 1,
        }}>
        {label}
        {hov && ReactDOM.createPortal(
          <div style={{
            position: 'fixed', top: pos.top, left: pos.left,
            transform: 'translate(-50%, -100%)', marginTop: -6,
            background: '#1c1c1e', color: '#fff',
            fontSize: 12, fontWeight: 400,
            fontFamily: 'var(--font-family-primary)',
            lineHeight: 1.5, padding: '6px 10px', borderRadius: 6,
            whiteSpace: 'nowrap', zIndex: 9999, pointerEvents: 'none',
            boxShadow: '0 4px 16px rgba(0,0,0,0.2)',
          }}>
            {tooltip}
            <span style={{
              position: 'absolute', bottom: -5, left: '50%', transform: 'translateX(-50%)',
              width: 0, height: 0,
              borderLeft: '5px solid transparent', borderRight: '5px solid transparent',
              borderTop: '5px solid #1c1c1e',
            }} />
          </div>,
          document.body
        )}
      </span>
    );
  };

  const IconDollar = () => (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
    </svg>
  );
  // IconBarcode definido globalmente (ver topo do arquivo)
  const IconUserRound = () => (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/>
    </svg>
  );

  return (
    <div
      onClick={() => onCardClick ? onCardClick(row.ait) : onSelect()}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
        position: 'relative', display: 'flex', alignItems: 'center',
        background: cardBg, border: cardBorder,
        borderRadius: 8, cursor: 'pointer',
        transition: 'box-shadow .15s, background .15s',
        boxShadow: cardShadow,
        fontFamily: 'var(--font-family-primary)',
        minHeight: 64, overflow: 'hidden',
      }}>

      {isNotificacao ? <BlueStripe /> : <OrangeStripe />}
      <CheckboxArea />

      {/* ── Information Container ── */}
      <div style={{ flex: 1, minWidth: 180, padding: '16px 16px' }}>
        {/* Title row */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', marginBottom: 8 }}>
          <span style={{ fontSize: 14, fontWeight: 700, color: '#0a0a0a', whiteSpace: 'nowrap' }}>
            AIT {row.ait}
          </span>
          {/* Tag de status principal */}
          {cfg.label && (
            <StatusPill
              bg={cfg.bg} color={cfg.color} label={cfg.label}
              tooltip={cfg.tooltip}
              onClick={
                (row.statusVariant === 'indique_agora' || row.statusVariant === 'em_aberto')
                  ? () => onBadgeAction && onBadgeAction(row.statusVariant, row)
                  : undefined
              }
            />
          )}
          {/* Tag de boleto (notificação) — apenas visual, ação está no botão */}
          {isNotificacao && boletoCfg && (
            <StatusPill
              bg={boletoCfg.bg || '#e8f3ea'}
              color={boletoCfg.color || '#405c44'}
              label={boletoCfg.label}
              tooltip={boletoCfg.tooltip}
            />
          )}
          {/* Tag secundária de indicação (apenas penalidade) */}
          {!isNotificacao && cfg.indLabel && (
            <StatusPill bg={cfg.indBg} color={cfg.indColor} label={cfg.indLabel}
              tooltip={(() => { const k = Object.keys(NOTIF_STATUS).find(k => NOTIF_STATUS[k].label === cfg.indLabel); return k ? NOTIF_STATUS[k].tooltip : undefined; })()}
            />
          )}
        </div>
        {/* Descrição */}
        <div style={{ fontSize: 13, color: '#606266', lineHeight: 1.3, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
          {row.codigoInfracao} - {row.nomeInfracao}
        </div>
      </div>

      {/* ── Meta cols ── */}
      <NewMetaCol label="DATA DA MULTA" width={132}>
        <span style={{ fontSize: 14, fontWeight: 700, color: '#0a0a0a', fontVariantNumeric: 'tabular-nums', whiteSpace: 'nowrap' }}>
          {row.dataInfracao || '—'}
        </span>
      </NewMetaCol>
      <NewMetaCol label="PLACA" width={100}>
        <span style={{ fontSize: 14, fontWeight: 700, color: '#0a0a0a', whiteSpace: 'nowrap' }}>
          {row.placa}
        </span>
      </NewMetaCol>
      <NewMetaCol label="ÓRGÃO" width={180}>
        <span
          title={row.orgao}
          style={{ fontSize: 14, fontWeight: 700, color: '#0a0a0a', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: 156, display: 'block' }}>
          {row.orgao}
        </span>
      </NewMetaCol>
      <NewMetaCol label="VALOR" width={100}>
        <span style={{ fontSize: 14, fontWeight: 700, color: '#0a0a0a', fontVariantNumeric: 'tabular-nums', whiteSpace: 'nowrap' }}>
          {row.valor}
        </span>
      </NewMetaCol>

      {/* Coluna final: PRAZO INDICAÇÃO (notificação) ou VENCIMENTO (penalidade) */}
      {isNotificacao && (
        <NewMetaCol label="PRAZO INDICAÇÃO" width={140}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
            <span style={{
              fontSize: 14, fontWeight: 700, fontVariantNumeric: 'tabular-nums', whiteSpace: 'nowrap',
              color: '#0a0a0a',
            }}>{row.prazoDataFormatada || '—'}</span>
            {row.prazoDataFormatada && (
              <PrazoInfoTooltip prazoOrgaoData={row.prazoOrgaoData} />
            )}
          </div>
        </NewMetaCol>
      )}
      {isPenalidade && (
        <NewMetaCol label="VENCIMENTO" width={140}>
          <span style={{ fontSize: 14, fontWeight: 700, color: '#0a0a0a', fontVariantNumeric: 'tabular-nums', whiteSpace: 'nowrap' }}>
            {row.vencimento || '—'}
          </span>
        </NewMetaCol>
      )}

      {/* ── Actions — largura fixa para alinhar colunas entre todos os cards ── */}
      <div onClick={(e) => e.stopPropagation()}
        style={{ display: 'flex', alignItems: 'center', gap: 6, flexShrink: 0, width: 120, justifyContent: 'flex-end', padding: '0 16px 0 4px' }}>
        {isNotificacao && (
          <>
            {row.statusVariant === 'indique_agora' && boletoCfg ? (() => {
              const [baixadoPos, setBaixadoPos] = useInfState(null);
              const barcodeRef = useInfRef(null);
              function handleBarcodeClick() {
                onBoletoAction && onBoletoAction(boletoCfg.action || 'solicitar', row);
                if (boletoCfg.action === 'download' && barcodeRef.current) {
                  const r = barcodeRef.current.getBoundingClientRect();
                  setBaixadoPos({ top: r.top - 8, left: r.left + r.width / 2 });
                  setTimeout(() => setBaixadoPos(null), 2000);
                }
              }
              return (
                <>
                  <span ref={barcodeRef} style={{ display: 'inline-flex' }}>
                    <CircleActionBtn
                      title={boletoCfg.action === 'download' ? 'Baixe o boleto' : (boletoCfg.tooltip || 'Ver boleto')}
                      onClick={handleBarcodeClick}>
                      <IconBarcode />
                    </CircleActionBtn>
                  </span>
                  {baixadoPos && ReactDOM.createPortal(
                    <div style={{
                      position: 'fixed',
                      top: baixadoPos.top,
                      left: baixadoPos.left,
                      transform: 'translate(-50%, -100%)',
                      zIndex: 99999,
                      background: 'var(--color-success-700)',
                      color: '#fff',
                      fontSize: 11, fontWeight: 600,
                      padding: '4px 10px',
                      borderRadius: 6,
                      whiteSpace: 'nowrap',
                      pointerEvents: 'none',
                      animation: 'fadeInOverlay .15s ease',
                      boxShadow: '0 2px 8px rgba(0,0,0,0.18)',
                    }}>
                      ✓ Boleto baixado
                    </div>,
                    document.body
                  )}
                </>
              );
            })() : row.statusVariant === 'indique_agora' ? (
              <CircleActionBtn title="Ver boleto" onClick={() => onBoletoAction && onBoletoAction('solicitar', row)}><IconBarcode /></CircleActionBtn>
            ) : null}
            <CircleActionBtn title="Indicar condutor" onClick={() => onOpenIndicacao && onOpenIndicacao(row)}><IconUserRound /></CircleActionBtn>
          </>
        )}
        {isPenalidade && (
          <>
            {cfg.showBarcode && <CircleActionBtn title="Ver boleto" onClick={() => onBoletoAction && onBoletoAction('solicitar', row)}><IconBarcode /></CircleActionBtn>}

          </>
        )}
        <CardMoreMenu row={row} />
      </div>
    </div>
  );

}

function NewMetaCol({ label, children, width }) {

}

// ─── Helper: chip filter ─────────────────────────────────────────────────────
// Suporta chips com statusVariants[] (multi-status) e chips de tipo (todas tab)
function chipMatchesRow(chipId, row, tab) {
  if (chipId === 'todos') return true;
  const chip = (CHIPS_BY_TAB[tab] || []).find((c) => c.id === chipId);
  if (chip && chip.statusVariants) return chip.statusVariants.includes(row.statusVariant);
  return row.tipo === chipId; // fallback para aba "todas" (filtra por tipo)
}

// ─── Sort helpers ─────────────────────────────────────────────────────────────
function parseBRDate(str) {
  if (!str) return null;
  const [d, m, y] = str.split('/');
  return new Date(Number(y), Number(m) - 1, Number(d));
}
function parseBRDateMs(str) {
  const d = parseBRDate(str);
  return d ? d.getTime() : null;
}
function venctoDays(str) {
  const ms = parseBRDateMs(str);
  if (ms === null) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((ms - today.getTime()) / 86400000);
}
function parseValorNum(str) {
  if (!str) return 0;
  return parseFloat(str.replace(/[^\d,]/g, '').replace(',', '.')) || 0;
}

// ─── SortDropdown ─────────────────────────────────────────────────────────────
function SortDropdown({ activeTab, activeSort, onSortChange }) {
  const [open, setOpen] = useInfState(false);
  const ref = useInfRef(null);
  const options = SORT_OPTIONS_BY_TAB[activeTab] || SORT_OPTIONS_BY_TAB.todas;
  const activeOption = options.find((o) => o.id === activeSort) || options[0];

  useInfEffect(() => {
    if (!open) return;
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open]);

  return (
    <div ref={ref} style={{ position: 'relative', flexShrink: 0 }}>
      {/* Trigger */}
      <button
        onClick={() => setOpen((v) => !v)}
        style={{
          display: 'inline-flex', alignItems: 'center', gap: 4,
          padding: '4px 8px',
          border: 'none', background: open ? 'var(--color-neutral-200)' : 'transparent',
          borderRadius: 6, cursor: 'pointer',
          fontFamily: 'var(--font-family-primary)',
          fontSize: 13, color: 'var(--color-neutral-700)',
          transition: 'background .12s', whiteSpace: 'nowrap',
        }}
        onMouseEnter={(e) => { e.currentTarget.style.background = 'var(--color-neutral-200)'; }}
        onMouseLeave={(e) => { if (!open) e.currentTarget.style.background = 'transparent'; }}>
        <span>Ordenar por: </span>
        <span style={{ fontWeight: 500 }}>{activeOption.label}</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="var(--color-neutral-500)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
          style={{ marginLeft: 2, transition: 'transform .15s', transform: open ? 'rotate(180deg)' : 'none' }}>
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>

      {/* Dropdown menu */}
      {open && (
        <div style={{
          position: 'absolute', top: 'calc(100% + 4px)', right: 0,
          background: '#fff',
          border: '1px solid var(--color-neutral-300)',
          borderRadius: 8,
          boxShadow: '0 4px 12px rgba(0,0,0,0.08)',
          minWidth: 240, zIndex: 100,
          overflow: 'hidden',
        }}>
          {options.map((opt) => {
            const isActive = opt.id === activeSort;
            return (
              <button
                key={opt.id}
                onClick={() => { onSortChange(opt.id); setOpen(false); }}
                style={{
                  display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                  width: '100%', padding: '8px 14px',
                  border: 'none', background: 'transparent',
                  fontFamily: 'var(--font-family-primary)',
                  fontSize: 13,
                  fontWeight: isActive ? 700 : 400,
                  color: isActive ? '#f9401b' : 'var(--color-neutral-800)',
                  cursor: 'pointer', textAlign: 'left',
                  transition: 'background .1s',
                }}
                onMouseEnter={(e) => { e.currentTarget.style.background = 'var(--color-neutral-200)'; }}
                onMouseLeave={(e) => { e.currentTarget.style.background = 'transparent'; }}>
                <span>{opt.label}</span>
                {isActive && (
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="#f9401b" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                )}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function KanbanCard({ row, onCardClick }) {
  const [hovered, setHovered] = useInfState(false);
  const isNotificacao = row.tipo === 'notificacao';

  const daysLeft = isNotificacao ? row.prazoIndicacao : venctoDays(row.vencimento);
  let prazoDisplay = '—';
  let prazoColor = 'var(--color-neutral-500)';
  if (daysLeft !== null && daysLeft !== undefined) {
    prazoDisplay = isNotificacao
      ? (row.prazoDataFormatada || String(daysLeft) + 'd')
      : (row.vencimento || '—');
    prazoColor = daysLeft <= 5
      ? 'var(--color-error-600)'
      : daysLeft <= 15
        ? 'var(--color-warning-600)'
        : 'var(--color-neutral-500)';
  }

  return (
    <div
      onClick={() => onCardClick && onCardClick(row.ait)}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
        background: hovered ? '#fafafa' : '#fff',
        border: '1px solid ' + (hovered ? 'var(--color-neutral-300)' : 'var(--color-neutral-200)'),
        borderRadius: 8,
        padding: 12,
        marginBottom: 8,
        cursor: 'pointer',
        transition: 'background .12s, border-color .12s',
        fontFamily: 'var(--font-family-primary)',
        minHeight: 80,
        boxSizing: 'border-box',
      }}>

      {/* Linha 1: AIT + ícones de ação */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8, marginBottom: 4 }}>
        <span style={{ fontSize: 12, fontWeight: 700, color: 'var(--color-neutral-900)', flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
          AIT {row.ait}
        </span>
        <div style={{ display: 'flex', gap: 4, flexShrink: 0 }}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-neutral-400)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
          {isNotificacao && (
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-neutral-400)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/>
            </svg>
          )}
        </div>
      </div>

      {/* Linha 2: código + descrição truncada */}
      <div style={{ fontSize: 11, color: 'var(--color-neutral-600)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', marginBottom: 8, lineHeight: 1.4 }}>
        {row.codigoInfracao} - {row.nomeInfracao}
      </div>

      {/* Linha 3: placa + valor + prazo */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
        <span style={{
          background: 'var(--color-neutral-100)', color: 'var(--color-neutral-700)',
          fontSize: 10, fontWeight: 700,
          borderRadius: 4, padding: '2px 6px',
          border: '1px solid var(--color-neutral-300)',
          whiteSpace: 'nowrap',
        }}>{row.placa}</span>
        <span style={{ fontSize: 11, fontWeight: 700, color: 'var(--color-neutral-900)', whiteSpace: 'nowrap' }}>
          {row.valor}
        </span>
        <span style={{ fontSize: 11, color: prazoColor, whiteSpace: 'nowrap' }}>
          {prazoDisplay}
        </span>
      </div>
    </div>
  );
}

// ─── KanbanColumn ─────────────────────────────────────────────────────────────

// ─── KanbanView ───────────────────────────────────────────────────────────────
function KanbanView({ activeTab, activeChip, activeSort, onCardClick }) {
  const allColumns = KANBAN_COLUMNS_BY_TAB[activeTab] || [];
  const activeSortFn = (SORT_OPTIONS_BY_TAB[activeTab] || [])
    .find((o) => o.id === activeSort)?.sortFn;

  function getColRows(col) {
    let rows;
    if (activeTab === 'todas') {
      rows = MOCK_ROWS.filter((r) => r.tipo === col.id);
    } else {
      rows = MOCK_ROWS.filter((r) => r.statusVariant === col.id);
    }
    return activeSortFn ? [...rows].sort(activeSortFn) : rows;
  }

  // Chip filter: suporta statusVariants[] (multi-status) ou fallback por col.id
  const visibleColumns = allColumns.filter((col) => {
    if (activeChip === 'todos') return true;
    const chip = (CHIPS_BY_TAB[activeTab] || []).find((c) => c.id === activeChip);
    if (chip && chip.statusVariants) return chip.statusVariants.includes(col.id);
    return col.id === activeChip;
  });

  return (
    <div style={{
      display: 'flex', gap: 12,
      overflowX: 'auto',
      padding: '0 0 24px 0',
      flexWrap: 'nowrap',
      alignItems: 'flex-start',
    }}>
      {visibleColumns.map((col) => (
        <KanbanColumn
          key={col.id}
          colDef={col}
          rows={getColRows(col)}
          onCardClick={onCardClick} />
      ))}
    </div>
  );
}

// ─── Demo FAB ─────────────────────────────────────────────────────────────────

    if (!open) return;
    const handler = (e) => {if (ref.current && !ref.current.contains(e.target)) setOpen(false);};

    return () => document.removeEventListener('mousedown', handler);
  }, [open]);

  { id: 'success', label: 'Sucesso', icon: '✓' },
  { id: 'loading', label: 'Carregando', icon: '⟳' },

  { id: 'error', label: 'Erro', icon: '!' }];


  return (
    <div
      ref={ref}
